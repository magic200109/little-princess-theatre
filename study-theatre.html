<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="guest.css">
<script src="guest.js"></script>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>書房劇場 · 樣本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iansui&family=LXGW+WenKai+TC:wght@400&family=Noto+Serif+TC:wght@400;500&display=swap">
<style>

:root{--paper-day:.05;--paper-night:.08;--paper-size:800px;--n:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#3a2f4f;font-family:"LXGW WenKai TC","Noto Serif TC",serif}
button{font:inherit;color:inherit}
.stage{position:absolute;left:50%;top:50%;width:min(100vw,177.78vh);height:min(56.25vw,100vh);transform:translate(-50%,-50%);container-type:size;overflow:hidden;background:#4d3d60}
.stage>svg,.stage>.frame{position:absolute;inset:0;width:100%;height:100%;display:block}
.frame{pointer-events:none;z-index:9}
#paperDay,#paperNight{position:absolute;inset:0;pointer-events:none;background:url(art/paper-qq.webp) center/var(--paper-size) auto repeat;z-index:3}
#paperDay{mix-blend-mode:multiply;opacity:calc(var(--paper-day) * (1 - var(--n)))}
#paperNight{mix-blend-mode:overlay;opacity:calc(var(--paper-night) * var(--n))}
.float{animation:floaty 5.5s ease-in-out infinite alternate}
.float.b{animation-duration:6.8s;animation-delay:-2.4s}
.float.c{animation-duration:4.7s;animation-delay:-1.1s}
@keyframes floaty{from{transform:translateY(0)}to{transform:translateY(-16px)}}
#shelfHot{cursor:pointer}


#mood{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity 1.4s ease}
#meteorSky{position:absolute;left:6%;top:8%;width:46%;height:34%;overflow:hidden;pointer-events:none;z-index:2}


.card{position:absolute;left:53.5%;top:11.5%;width:36.5%;max-height:77%;z-index:4;background:#fbf6ec;color:#3b2f45;border-radius:3px;
  box-shadow:.5px 1.5px 2px rgba(26,20,48,.3),0 2cqh 3.5cqh -1.5cqh rgba(10,8,25,.6);display:flex;flex-direction:column;transition:opacity .2s ease}

.card.fade{opacity:0}
.card::before,.card::after{content:'';position:absolute;top:-14cqh;width:1.2px;height:14cqh;background:#e9d7a6}
.card::before{left:14%}
.card::after{right:14%}
.card>.tex{position:absolute;inset:0;border-radius:3px;pointer-events:none;background:url(art/paper-qq.webp) center/600px auto;mix-blend-mode:multiply;opacity:.12}
.card>.brad{position:absolute;top:1cqh;width:.75cqw;height:.75cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fbe7a8,#cfa64e 55%,#7d5f24);box-shadow:.5px 1px 1.5px rgba(0,0,0,.35)}
.card>.brad.l{left:calc(14% - .32cqw)}
.card>.brad.r{right:calc(14% - .32cqw)}

.card .inner{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;margin:5.4cqh 3.4cqw .4cqh 2.6cqw;padding:1.2cqh .6cqw 2.2cqh 0;scrollbar-width:thin;scrollbar-color:#d8c8b0 transparent;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 1.4cqh,#000 calc(100% - 2.2cqh),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 1.4cqh,#000 calc(100% - 2.2cqh),transparent 100%)}
.card .nav{position:relative;display:flex;align-items:center;justify-content:space-between;gap:1cqw;padding:1.4cqh 2cqw 1.8cqh;border-top:1px dashed #d8c8b0;font-family:Iansui,serif;font-size:clamp(12px,.95cqw,16px);color:#7a6884}
.pbtn{font-family:Iansui,serif;font-size:clamp(12px,.92cqw,16px);background:#fffaf1;border:1px solid #c9b6c9;border-radius:999px;padding:.35cqh .9cqw;cursor:pointer;color:#4a3a55;white-space:nowrap}
.pbtn:hover{border-color:#b48aa8;background:#fff}
.pbtn[disabled]{opacity:.35;cursor:default}


.prog h2{font-family:Iansui,serif;font-weight:400;font-size:clamp(18px,1.7cqw,30px);letter-spacing:.14em;text-align:center}
.prog .sub{font-family:Iansui,serif;font-size:clamp(11px,.85cqw,15px);color:#8a7894;text-align:center;margin:.6cqh 0 2.2cqh;letter-spacing:.04em}
.prog .sec{font-family:Iansui,serif;font-size:clamp(11px,.85cqw,15px);color:#9a7f99;letter-spacing:.2em;margin:1.8cqh 0 .8cqh;display:flex;align-items:center;gap:.6cqw}
.prog .sec::after{content:'';flex:1;border-top:1px dotted #d8c8b0}
.prog .row{display:flex;flex-wrap:wrap;gap:.5cqw}
.prog ol{list-style:none}
.prog li button{width:100%;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.8cqw;text-align:left;background:none;border:0;border-bottom:1px solid #efe4d2;padding:1cqh .3cqw;cursor:pointer}
.prog li button:hover{background:rgba(180,138,168,.08)}
.prog .no{font-family:Iansui,serif;font-size:clamp(11px,.8cqw,14px);color:#b49a7a;min-width:2.2cqw}
.prog .t{font-family:Iansui,serif;font-size:clamp(13px,1.05cqw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:.5cqw}
.prog .t i{flex:none;display:inline-block;width:.5cqw;height:1.6cqh;border-radius:1px;background:var(--rb)}
.prog .t i.early{width:.18cqw}
.prog .d{font-family:Iansui,serif;font-size:clamp(11px,.78cqw,14px);color:#9a8aa4;white-space:nowrap}
.badge{font-family:Iansui,serif;font-size:clamp(10px,.7cqw,12px);padding:0 .35cqw;border-radius:3px;flex:none}
.badge.new{background:#f3d28e;color:#5a4626}
.badge.shut{background:#6e4a6c;color:#f3d28e}
.prog .pager{display:flex;justify-content:space-between;margin-top:1.4cqh}
.ask{margin-top:2.6cqh;font-family:Iansui,serif;font-size:clamp(13px,1cqw,17px);color:#6e5f7a;display:flex;align-items:baseline;gap:.6cqw}
.ask input{flex:1;min-width:0;font-family:Iansui,serif;font-size:clamp(14px,1.1cqw,19px);color:#3b2f45;background:none;border:0;border-bottom:1.2px solid #b49a7a;padding:.2cqh .2cqw;outline:none}
.ask input::placeholder{color:#c4b4c8}
.empty{font-family:Iansui,serif;color:#9a8aa4;text-align:center;padding:3cqh 0;font-size:clamp(12px,.95cqw,16px)}

.books{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.25cqw;row-gap:1.6cqh;padding:1cqh .4cqw 0}
.book{position:relative;width:var(--w);height:var(--h);background:var(--c);border-radius:2px 2px 1px 1px;cursor:pointer;border:0;
  box-shadow:inset -3px 0 0 rgba(0,0,0,.09),.5px 1px 1.5px rgba(26,20,48,.3);transition:transform .25s cubic-bezier(.22,1,.36,1);display:flex;justify-content:center;padding-top:1.5cqh}
.book::before,.book::after{content:'';position:absolute;left:3px;right:3px;height:2px;background:#d9b45a}
.book::before{top:.7cqh}
.book::after{bottom:.8cqh}
.book span{writing-mode:vertical-rl;font-family:Iansui,serif;font-size:clamp(11px,.85cqw,14px);letter-spacing:.06em;color:var(--spine);white-space:nowrap;overflow:hidden;max-height:calc(var(--h) - 3cqh)}
.book:hover{transform:translateY(-.8cqh)}
.plank{height:1.2cqh;margin:0 0 1cqh;background:#9a7458;border-top:2px solid #e9d7a6;border-radius:2px;box-shadow:0 .6cqh .9cqh -.5cqh rgba(20,14,40,.5)}


.ribbon[hidden]{display:none}
.ribbon{position:absolute;top:-.8cqh;right:4%;width:1.4cqw;height:8.5cqh;background:var(--rb);z-index:5;clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.ribbon.early{width:.3cqw;clip-path:none;height:12cqh}
.play .meta{display:flex;justify-content:space-between;gap:1cqw;font-family:Iansui,serif;font-size:clamp(11px,.82cqw,14px);letter-spacing:.06em;color:#8a7894}
.play h3{font-family:Iansui,serif;font-weight:400;font-size:clamp(17px,1.5cqw,26px);line-height:1.45;margin:.8cqh 0 1.6cqh 0;color:#3b2f45}
.play .dir{font-size:clamp(12px,.92cqw,16px);line-height:1.8;color:#7a6884;border-left:2px solid #e3c98a;padding:.2cqh 0 .2cqh 1cqw;margin-bottom:2cqh;white-space:pre-wrap}
.play .script p{font-size:clamp(13px,1.02cqw,18px);line-height:1.9;margin-bottom:.9cqh;white-space:pre-wrap;word-break:break-word}
.play .script .gap{height:.8cqh}
.play .script h4{font-family:Iansui,serif;font-weight:400;font-size:clamp(13px,1.05cqw,18px);color:#9a7f99;letter-spacing:.1em;margin:1.8cqh 0 .6cqh}
.play q{quotes:none;color:#8a4f78}
.say{display:grid;grid-template-columns:4.6cqw 1fr;gap:.9cqw;align-items:baseline;margin:1.1cqh 0}
.say .who{font-family:Iansui,serif;font-size:clamp(11px,.85cqw,15px);color:#9a7f99;text-align:right;letter-spacing:.12em}
.say .what{font-family:Iansui,serif;font-size:clamp(14px,1.15cqw,20px);line-height:1.75;color:#5a3550}
.say .aside{grid-column:2;font-size:clamp(11px,.8cqw,14px);color:#a597ae;margin-top:-.4cqh}
.play .tags{display:flex;flex-wrap:wrap;gap:.4cqw;margin-top:2.2cqh}
.play .tags span{font-family:Iansui,serif;font-size:clamp(10px,.75cqw,13px);padding:.1cqh .55cqw;border:1px solid #d8c8d8;border-radius:3px;color:#8a7894;background:#fffaf1}

.veil{position:absolute;inset:0;z-index:3;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqh;
  background:repeating-linear-gradient(90deg,#6e4a6c 0 2cqw,#845d81 2cqw 3.1cqw,#6e4a6c 3.1cqw 4cqw);box-shadow:inset 0 -1cqh 0 #c9a24e;color:#f3d28e;font-family:Iansui,serif;text-align:center;padding:0 3cqw}
.veil p{font-size:clamp(13px,1.05cqw,18px);line-height:1.8}
.veil .pbtn{background:#f7efdf}

.inter{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:2.4cqh;text-align:center;font-family:Iansui,serif}
.inter h2{font-weight:400;font-size:clamp(18px,1.6cqw,28px);letter-spacing:.2em}
.inter p{color:#8a7894;font-size:clamp(12px,.95cqw,16px)}
.inter .row{display:flex;gap:.8cqw}


.curtain{position:absolute;top:0;bottom:0;width:51%;z-index:8;transition:transform .75s cubic-bezier(.65,0,.35,1);
  background:repeating-linear-gradient(90deg,#6e4a6c 0 2.2cqw,#845d81 2.2cqw 3.4cqw,#6e4a6c 3.4cqw 4.4cqw);box-shadow:inset 0 -1.4cqh 0 #c9a24e}
.curtain::after{content:'';position:absolute;inset:0;background:url(art/paper-qq.webp) center/700px auto;mix-blend-mode:multiply;opacity:.18}
.curtain.l{left:0;transform:translateX(-100%)}
.curtain.r{right:0;transform:translateX(100%)}
.stage.closed .curtain{transform:none}

#frameStars{position:absolute;inset:0;width:100%;height:100%;z-index:10;pointer-events:none}
#frameStars .hot{pointer-events:auto;cursor:pointer}
#frameStars .tag{opacity:0;transition:opacity .2s}
#frameStars .on .tag{opacity:1}
.plateText{font-family:Iansui,serif}

#scene image{pointer-events:none}

#starfall{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;opacity:0}
#starfall>div{position:absolute}


.tools{display:flex;flex-wrap:wrap;gap:.5cqw;margin-top:2cqh;padding-top:1.4cqh;border-top:1px dotted #e3d6c2}
.edit h2{font-family:Iansui,serif;font-weight:400;font-size:clamp(17px,1.45cqw,25px);letter-spacing:.1em;color:#3b2f45}
.edit .stamp{font-family:"Crimson Pro",Iansui,serif;font-style:italic;font-size:clamp(11px,.78cqw,13px);color:#9a8aa4;margin:.2cqh 0 .6cqh}
.edit label{display:block;font-family:Iansui,serif;font-size:clamp(11px,.8cqw,14px);color:#9a7f99;letter-spacing:.08em;margin:1.4cqh 0 .5cqh}
.edit input,.edit textarea,.edit select{width:100%;font-family:"LXGW WenKai TC","Noto Serif TC",serif;font-size:clamp(13px,.98cqw,17px);line-height:1.75;color:#3b2f45;background:#f6efdd;border:1px solid #ddcfa8;border-radius:6px;padding:.8cqh .8cqw;outline:none;resize:vertical}
.edit input:focus,.edit textarea:focus,.edit select:focus{border-color:#b48aa8;background:#fffaf0}
.edit textarea.c{min-height:30cqh}
.edit .split{display:grid;grid-template-columns:1fr 1fr;gap:1.2cqw}
.pbtn.plant{background:#a85a63;border-color:#a85a63;color:#fff}
.pbtn.plant:hover{background:#97505a}
.say-note{font-family:Iansui,serif;font-size:clamp(11px,.85cqw,15px);color:#8a4f78;margin-top:1.2cqh}


.meteor{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform,opacity}
.mt-tail{position:absolute;left:4px;height:var(--h);width:var(--L);top:var(--y);border-radius:2px;background:var(--c);opacity:var(--o);box-shadow:0 0 4px rgba(255,226,160,.35)}
.mt-star{position:absolute;left:-11px;top:-11px;width:22px;height:22px;filter:drop-shadow(0 0 4px rgba(255,226,160,.85)) drop-shadow(.5px 1px 1px rgba(26,20,48,.4));animation:mtwob .45s ease-in-out infinite alternate}
@keyframes mtwob{from{transform:rotate(-14deg)}to{transform:rotate(22deg)}}
.mt-hit{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;background:none;border:0;padding:0;cursor:pointer;pointer-events:auto}
.meteor.caught .mt-star{animation:none;transition:transform .4s cubic-bezier(.22,1,.36,1);transform:scale(1.9) rotate(144deg)}

.mt-bit{position:absolute;left:0;top:0;pointer-events:none;filter:drop-shadow(0 0 2px rgba(255,226,160,.8))}

.plane{position:absolute;left:0;top:0;width:0;height:0;will-change:transform,opacity}
.pl-svg{position:absolute;left:-29px;top:-17px;width:58px;height:34px;filter:drop-shadow(.5px 2px 1.5px rgba(40,30,70,.35));transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .45s ease}
.plane.caught .pl-svg{transform:scale(1.9) rotate(-14deg);opacity:0}
</style>
</head>
<body>
<div class="stage closed" id="stage">
  <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="paper" x="-3%" y="-3%" width="106%" height="112%">
        <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="7" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0" result="mono"/>
        <feComposite in="mono" in2="SourceGraphic" operator="in" result="t"/>
        <feBlend in="SourceGraphic" in2="t" mode="soft-light" result="tex"/>
        <feComposite in="tex" in2="SourceGraphic" operator="arithmetic" k2="0" k3="1" result="p"/>
        <feDropShadow in="p" dx="0" dy="4" stdDeviation="5" flood-color="#0a0b1c" flood-opacity=".42"/>
      </filter>
      <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="pshadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx=".5" dy="1.2" stdDeviation=".9" flood-color="#1a1430" flood-opacity=".3"/></filter>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="rim" x="-20%" y="-20%" width="140%" height="140%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="1.7" result="d"/>
        <feFlood id="rimFlood" flood-color="#ffd98c" flood-opacity="0"/>
        <feComposite in2="d" operator="in" result="glowShape"/>
        <feGaussianBlur in="glowShape" stdDeviation="2.8" result="g"/>
        <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <radialGradient id="lightGrad" gradientUnits="userSpaceOnUse" cx="600" cy="285" r="1150">
        <stop offset="0" stop-color="#fff4cf"/><stop offset=".18" stop-color="#f6c477"/>
        <stop offset=".42" stop-color="#c47aa6"/><stop offset=".7" stop-color="#4b3a86"/>
        <stop offset="1" stop-color="#151a44"/>
      </radialGradient>
      <mask id="moonCapMask"><circle r="92" fill="#fff"/><circle cx="36" cy="-22" r="88" fill="#000"/></mask>
    </defs>
  </svg>
  <div id="paperDay"></div><div id="paperNight"></div>
  <div id="mood"></div>
  <div id="starfall"></div>
  <div id="meteorSky" aria-hidden="true"></div>
  <section class="card" id="card"><span class="tex"></span><span class="brad l"></span><span class="brad r"></span><span class="ribbon" id="ribbon" hidden></span>
    <div class="inner" id="cardInner"></div>
    <div class="nav" id="cardNav"></div>
  </section>
  <div class="curtain l"></div><div class="curtain r"></div>
  <img class="frame" src="art/stage/frame-v2.webp" alt="">
  <svg id="frameStars" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="starLine" x="-40%" y="-40%" width="180%" height="180%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="2.2" result="d"/>
        <feComposite in="d" in2="SourceAlpha" operator="out" result="ring"/>
        <feFlood flood-color="#ffe6a6" flood-opacity=".95"/>
        <feComposite in2="ring" operator="in" result="line"/>
        <feGaussianBlur in="line" stdDeviation="1.2" result="gl"/>
        <feMerge><feMergeNode in="gl"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>
