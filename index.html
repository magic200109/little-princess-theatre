<head>
<meta charset="utf-8">

<title>紙劇場樣本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

html,body{margin:0;height:100%;overflow:hidden;background:#141833;font-family:"Noto Serif TC","Songti TC",serif;color:#f6ead2}
.stage{position:fixed;inset:0;overflow:hidden;cursor:grab}
.stage:active{cursor:grabbing}
.layer{position:absolute;left:0;top:0;height:100%;will-change:transform}

.layer{pointer-events:none}
.layer [data-k],.layer [data-k] *{pointer-events:visiblePainted}
.fixed{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}


.paint{transition:fill 1.6s ease,stroke 1.6s ease,opacity 1.6s ease}
.sky{fill:#b4bfe0}            .night .sky{fill:#0c0f27;opacity:.28}
.far{fill:#8fa2d2}            .night .far{fill:#141836}
.planet{fill:#a993c6}         .night .planet{fill:#12142f}
.hill1{fill:#6f80b6}          .night .hill1{fill:#10132c}
.hill2{fill:#7a6198}          .night .hill2{fill:#0d0f25}
.rock{fill:#efe4cf}           .night .rock{fill:#0e1028}
.grass{fill:#8fae7b}          .night .grass{fill:#0b0d22}
.wall{fill:#f4e9d6}           .night .wall{fill:#0f1129}
.roof{fill:#b48aa8}           .night .roof{fill:#0d0f26}
.wood{fill:#9a7458}           .night .wood{fill:#0c0e24}
.leaf{fill:#6f9466}           .night .leaf{fill:#090b1f}
.fore{fill:#3f5a48}           .night .fore{fill:#05061a}
.frameP{fill:#5b4a6e}         .night .frameP{fill:#04050f}
.frameL{fill:#6f8f62}         .night .frameL{fill:#060713}
.edge{stroke:#fffaf0;stroke-width:1.6;stroke-opacity:.55}
.night .edge{stroke-opacity:0}
.hill0{fill:#a3b1dc}          .night .hill0{fill:#1a1d40}
.hill3{fill:#5d4f8c}          .night .hill3{fill:#0a0c22}
.cloud1{fill:#ece8f5}         .night .cloud1{fill:#1b1e44}
.cloud2{fill:#ddd5ec}         .night .cloud2{fill:#14173a}
.flower{fill:#b98aa9}         .night .flower{fill:#04051a}
.stem{fill:#4f6b4c}           .night .stem{fill:#04051a}
.puff{fill:#f6f0e2}           .night .puff{fill:#05061b}
.wingB{fill:#7f9c72}          .night .wingB{fill:#0b0d24}
.wingF{fill:#577650}          .night .wingF{fill:#04050f}
.string{stroke:#cdb98a}       .night .string{stroke:#e9d7a6}
.win{fill:#f3d9a0;opacity:.55}  .night .win{fill:#ffd98c;opacity:1}
.pstar{fill:#f2d48e}          .night .pstar{fill:#ffe7a8}


#backlight{opacity:.22;transition:opacity 1.8s ease}
.night #backlight{opacity:1}
#holeGlow{opacity:.15;transition:opacity 1.8s ease}
.night #holeGlow{opacity:1}
#frontWash{opacity:.18;transition:opacity 1.6s ease}
.night #frontWash{opacity:0}


.dress{fill:#f5ecdb} .hair{fill:#e3c27b} .skin{fill:#f6dcc8} .scarf{fill:#b88aa9}
.shoe{fill:#7a4b32} .crown{fill:#e6b95c} .eye{fill:#3a2a30} .blush{fill:#f1a9a6;opacity:.6}
.night .dress,.night .hair,.night .skin,.night .shoe,.night .crown{fill:#0b0d22}
.night .scarf{fill:#2a1c35} .night .eye,.night .blush{opacity:0}
.stock{fill:#fbf6ec} .night .stock{fill:#0b0d22}
.thin{stroke:#fffaf0;stroke-width:.9;stroke-opacity:.7} .night .thin{stroke-opacity:0}

.night .pc-armB .paint:not(.brad){fill:#05061a}
.night .pc-legB .paint:not(.brad){fill:#080a20}
.night .pc-torso .paint{fill:#0e1029}
.night .pc-legF .paint:not(.brad){fill:#171a3e}
.night .pc-scarf .paint:not(.brad){fill:#3a2650}
.night .pc-armF .paint:not(.brad){fill:#262a58}
.night .pc-head .skin,.night .pc-head .hair{fill:#12142f}
.night .pc-head .crown{fill:#5a4626}
.night [class^="pc-"] .thin{stroke:#ffd98c;stroke-opacity:.22}

.brad{fill:#cfa64e} .night .brad{fill:#e6c06a}
.bradHi{fill:#fff4d2;opacity:.85}

[data-k]{cursor:pointer}
.starHot{pointer-events:auto;cursor:pointer}
.plateText{font-family:var(--plate-font);letter-spacing:.12em}
:root{--plate-font:"Iansui","Noto Serif TC",serif}
#mapCard{font-family:var(--plate-font)}
#mapCard{position:fixed;z-index:6;background:#f7efdff2;color:#3b2f45;border:1px solid #b9a27f;border-radius:10px;padding:10px 12px;box-shadow:0 6px 18px #0005;font-size:13px;letter-spacing:.12em}
#mapCard[hidden]{display:none}
#mapCard h4{margin:0 0 6px;font-size:12px;font-weight:400;opacity:.7}
#mapCard button{display:block;width:100%;text-align:left;font:inherit;background:none;border:0;border-radius:6px;padding:5px 8px;color:inherit;cursor:pointer}
#mapCard button:hover{background:#e9dcc2}
#tunePanel{position:fixed;left:18px;bottom:18px;z-index:6;width:280px;max-height:80vh;overflow:auto;background:#f6ecd9f2;color:#3b2f45;border:1px solid #b9a27f;border-radius:14px;padding:12px 14px;font-size:12px;box-shadow:0 6px 20px #0005}
#tunePanel[hidden]{display:none}
#tunePanel h4{margin:0 0 8px;font-size:13px;letter-spacing:.12em;font-weight:400}
#tunePanel label{display:grid;grid-template-columns:84px 1fr 44px;align-items:center;gap:6px;margin:5px 0}
#tunePanel input{width:100%;accent-color:#b48aa8}
#tunePanel .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#tunePanel button{font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid #b9a27f;background:#fff8ec;color:#3b2f45;cursor:pointer}
#tunePanel .note{margin-top:6px;opacity:.75}

:root{--paper-day:.05;--paper-night:.08;--paper-size:800px}
#paperDay,#paperNight{position:absolute;inset:0;pointer-events:none;background:url(art/paper-qq.webp) center/var(--paper-size) auto repeat}
#paperDay{mix-blend-mode:multiply}
#paperNight{mix-blend-mode:overlay}
#starfall{position:absolute;left:0;top:0;pointer-events:none;mix-blend-mode:screen}
#starfall>div{position:absolute;width:243px;height:297px;transform-origin:0 0}
.ui{position:fixed;top:18px;right:18px;display:flex;gap:10px;z-index:5}
.ui,.title,.hint{display:none!important}
#tunePanel .clock{margin-bottom:10px}
.ui button{font:inherit;font-size:13px;letter-spacing:.12em;color:#3b2f45;background:#f6ecd9e6;border:1px solid #b9a27f;border-radius:999px;padding:8px 16px;cursor:pointer;box-shadow:0 3px 10px #0004}
.night .ui button{color:#f6e3b8;background:#141833cc;border-color:#f3d39a70}
.clock{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.1em;color:#3b2f45;background:#f6ecd9e6;border:1px solid #b9a27f;border-radius:999px;padding:4px 6px 4px 14px;box-shadow:0 3px 10px #0004;transition:color 1.6s,background 1.6s}
.night .clock{color:#f6e3b8;background:#141833cc;border-color:#f3d39a70}
.clock input{width:120px;accent-color:#b48aa8}
.clock button{padding:5px 10px!important;font-size:12px!important;box-shadow:none!important}
.title{position:fixed;top:18px;left:22px;z-index:5;font-size:13px;letter-spacing:.2em;color:#3b2f45;transition:color 1.6s}
.night .title{color:#f3dcae}
.title b{display:block;font-size:22px;letter-spacing:.08em;font-weight:400;margin-top:4px}
.hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.14em;color:#3b2f45cc;z-index:5;transition:color 1.6s}
.night .hint{color:#f3dcaecc}
@media(max-width:700px){.ui{top:auto;bottom:44px;right:50%;transform:translateX(50%)}.ui button{font-size:12px;padding:7px 12px}}


#homeCard{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(20,16,35,.4)}
#homeCard[hidden]{display:none}
#homeCard .hc{position:relative;width:min(560px,92vw);max-height:86vh;overflow:auto;background:#fbf6ea;color:#3b2f45;border-radius:4px;padding:26px 30px 22px;
  box-shadow:0 18px 40px -16px rgba(10,8,25,.75);font-family:"LXGW WenKai TC","Noto Serif TC",serif;animation:hcIn .45s cubic-bezier(.22,1,.36,1)}
#homeCard .hc::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:url(art/paper-qq.webp) center/600px auto;mix-blend-mode:multiply;opacity:.1}
@keyframes hcIn{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
#homeCard .x{position:absolute;right:14px;top:10px;font-size:22px;color:#9a7f99;cursor:pointer;font-family:var(--plate-font);z-index:1}
#homeCard .hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-family:var(--plate-font)}
#homeCard .hd b{font-weight:400;font-size:24px;letter-spacing:.08em}
#homeCard .nav{display:flex;gap:8px;margin-right:22px}
#homeCard .nav button,#homeCard .acts button{font-family:var(--plate-font);font-size:15px;background:#fffaf1;border:1px solid #c9b6c9;border-radius:999px;padding:3px 14px;cursor:pointer;color:#6a5470}
#homeCard .nav button:hover,#homeCard .acts button:hover{border-color:#8a4f78;color:#8a4f78}
#homeCard .acts button:disabled{opacity:.45;cursor:default}
.calEn{font-family:var(--plate-font);font-size:13px;color:#9a8aa4;letter-spacing:.2em}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:16px}
.calGrid .wd{font-family:var(--plate-font);text-align:center;font-size:14px;color:#a8846a;padding-bottom:4px}
.calGrid .c{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-family:var(--plate-font);font-size:17px;color:#b8acbd}
.calGrid .c.has{color:#3b2f45;cursor:pointer}
.calGrid .c.has::after{content:'';position:absolute;bottom:14%;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#c98aa0}
.calGrid .c.heavy::after{width:10px;margin-left:-5px;border-radius:3px;background:#b06a88}
.calGrid .c.has:hover{background:rgba(201,138,160,.16)}
.calGrid .c.today{box-shadow:inset 0 0 0 2px #c9a24e}
.calGrid .c.out{visibility:hidden}
.hcFoot{font-family:var(--plate-font);font-size:14px;color:#9a8aa4;text-align:center;margin-top:14px;letter-spacing:.06em}
.noteNo{font-family:var(--plate-font);font-size:14px;letter-spacing:.2em;color:#a8846a}
.noteDate{font-family:var(--plate-font);font-size:14px;color:#9a8aa4;margin-top:4px;letter-spacing:.06em}
.noteBody{font-size:20px;line-height:1.9;margin-top:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.noteSig{font-family:var(--plate-font);font-size:16px;color:#8a4f78;text-align:right;margin-top:14px}
#homeCard .acts{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
#bellSay{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);z-index:21;font-family:var(--plate-font);font-size:15px;letter-spacing:.06em;background:#f7efdf;color:#4a3a55;
  border:1px solid #9a7f99;border-radius:999px;padding:6px 16px;box-shadow:.5px 1.5px 2px rgba(26,20,48,.35);opacity:0;transition:opacity .3s;pointer-events:none}
#bellSay.on{opacity:1}
.noteBob{animation:noteBob 2.8s ease-in-out infinite}
@keyframes noteBob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-6px) rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.noteBob{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    
    <filter id="paper" x="-3%" y="-3%" width="106%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="mono"/>
      <feComposite in="mono" in2="SourceGraphic" operator="in" result="t"/>
      <feBlend in="SourceGraphic" in2="t" mode="soft-light" result="tex"/>
      <feComposite in="tex" in2="SourceGraphic" operator="arithmetic" k2="0" k3="1" result="p"/>
      <feDropShadow in="p" dx="0" dy="4" stdDeviation="5" flood-color="#0a0b1c" flood-opacity=".42"/>
    </filter>
    
    <filter id="piece" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="5" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="mono"/>
      <feComposite in="mono" in2="SourceGraphic" operator="in" result="t"/>
      <feBlend in="SourceGraphic" in2="t" mode="soft-light" result="tex"/>
      <feComposite in="tex" in2="SourceGraphic" operator="arithmetic" k2="0" k3="1" result="p"/>
      <feDropShadow in="p" dx=".6" dy="1.6" stdDeviation="1.1" flood-color="#1a1430" flood-opacity=".38"/>
    </filter>
    <filter id="pshadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx=".5" dy="1.2" stdDeviation=".9" flood-color="#1a1430" flood-opacity=".3"/></filter>
    
    
    <filter id="crumple" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="turbulence" baseFrequency=".055" numOctaves="3" seed="11" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="2.6" lighting-color="#fff" result="lit">
        <feDistantLight azimuth="225" elevation="48"/>
      </feDiffuseLighting>
      <feComposite in="lit" in2="SourceGraphic" operator="in" result="litIn"/>
      <feBlend in="SourceGraphic" in2="litIn" mode="multiply" result="m"/>
      <feComposite in="m" in2="SourceGraphic" operator="arithmetic" k2=".72" k3=".42" result="c"/>
      <feDropShadow in="c" dx="0" dy="4" stdDeviation="4" flood-color="#0a0b1c" flood-opacity=".45"/>
    </filter>
    
    <filter id="rim" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.7" result="d"/>
      <feFlood id="rimFlood" flood-color="#ffd98c" flood-opacity="0"/>
      <feComposite in2="d" operator="in" result="glowShape"/>
      <feGaussianBlur in="glowShape" stdDeviation="2.8" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>

<div class="stage" id="stage">
  <svg class="fixed" id="back" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="lightGrad" gradientUnits="userSpaceOnUse" cx="1010" cy="310" r="1150">
        <stop offset="0" stop-color="#fff4cf"/><stop offset=".18" stop-color="#f6c477"/>
        <stop offset=".42" stop-color="#c47aa6"/><stop offset=".7" stop-color="#4b3a86"/>
        <stop offset="1" stop-color="#151a44"/>
      </radialGradient>
    </defs>
    <rect width="1600" height="900" fill="#dfe3f2"/>
    <rect id="backlight" width="1600" height="900" fill="url(#lightGrad)"/>
  </svg>
  <div id="layers"></div>
  <svg class="fixed" id="princessSvg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"></svg>
  <svg class="fixed" id="frameSvg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"></svg>
  <svg class="fixed" id="wash" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <rect id="frontWash" width="1600" height="900" fill="#ffe9c4" style="mix-blend-mode:soft-light"/>
  </svg>
  <div id="paperDay"></div><div id="paperNight"></div>
</div>

<div class="title">紙劇場 · 效果樣本<b>小公主的星際旅行</b></div>
<div id="homeCard" hidden></div><div id="bellSay"></div>
<div class="ui">
  <div class="clock"><span id="clockTxt">--:--</span><input id="clockRange" type="range" min="0" max="1439" step="1" aria-label="預覽一天的時間"><button id="nowBtn" type="button" hidden>回到現在</button></div>
  <button id="tuneBtn" type="button">調整</button>
  <button id="lampBtn" type="button">關燈</button>
  <button id="dollBtn" type="button" hidden>小公主：平面紙片</button>
</div>
<div id="mapCard" hidden><h4>旅程地圖</h4><div id="mapList"></div></div>
<div id="tunePanel" hidden>
  <div id="clockSlot"></div>
  <div class="row" style="margin:0 0 10px"><button type="button" id="plateBtn">站名紙牌：顯示</button><button type="button" id="earBtn">一起聽：顯示</button></div>
  <label style="display:grid;grid-template-columns:84px 1fr 44px;align-items:center;gap:6px;margin:0 0 10px"><span>走路速度</span><input id="speedIn" type="range" min="0.4" max="2" step="0.05"><span id="speedVal"></span></label>
  <h4>坐姿調整 · <span id="tuneWhere">現在：星星路</span></h4>
  <div id="tuneRows"></div>
  <div class="row"><button type="button" id="tuneSit">坐下</button><button type="button" id="tuneStand">站起來</button><button type="button" id="tuneCopy">複製數值</button><button type="button" id="tuneReset">重設</button></div>
  <h4 style="margin-top:12px">夜裡的剪影</h4>
  <div id="silRows"></div>
  <div class="note" id="tuneNote">拖滑桿她會馬上跟著變。調好按「複製數值」貼給我。</div>
</div>
