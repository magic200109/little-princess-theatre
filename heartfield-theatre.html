<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="guest.css">
<script src="guest.js"></script>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心田 · 紙劇場樣本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iansui&family=LXGW+WenKai+TC:wght@400&family=Noto+Serif+TC:wght@400;500&display=swap">
<style>

:root{--paper-day:.05;--paper-night:.08;--paper-size:800px;--n:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#3a2f4f;font-family:"LXGW WenKai TC","Noto Serif TC",serif}
button{font:inherit;color:inherit}
.stage{position:absolute;left:50%;top:50%;width:min(100vw,177.78vh);height:min(56.25vw,100vh);transform:translate(-50%,-50%);container-type:size;overflow:hidden;background:#4d3d60;touch-action:none}
.stage>svg,.stage>.frame{position:absolute;inset:0;width:100%;height:100%;display:block}
.frame{pointer-events:none;z-index:9}
#scene image{pointer-events:none}
#paperDay,#paperNight{position:absolute;inset:0;pointer-events:none;background:url(art/paper-qq.webp) center/var(--paper-size) auto repeat;z-index:4}
#paperDay{mix-blend-mode:multiply;opacity:calc(var(--paper-day) * (1 - var(--n)))}
#paperNight{mix-blend-mode:overlay;opacity:calc(var(--paper-night) * var(--n))}
.plateText{font-family:Iansui,serif}
#starfall{position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;opacity:0}
#starfall>div{position:absolute}
#fore{z-index:4;pointer-events:none}

.dimN{filter:brightness(calc(1 - .62 * var(--n))) saturate(calc(1 - .4 * var(--n)))}


#htag{position:absolute;z-index:8;pointer-events:none;opacity:0;transition:opacity .15s;translate:-50% 0;max-width:24cqw;
  background:#f7efdf;border:1px solid #9a7f99;border-radius:4px;padding:.5cqw .9cqw;box-shadow:.5px 1.5px 2px rgba(26,20,48,.35);text-align:center}
#htag.show{opacity:1}
#htag b{display:block;font-family:Iansui,serif;font-weight:400;font-size:clamp(13px,1cqw,17px);color:#3b2f45;line-height:1.4}
#htag span{display:block;font-family:Iansui,serif;font-size:clamp(11px,.8cqw,14px);color:#7a6a82;margin-top:.15cqw;line-height:1.5}


#mail{position:absolute;inset:0;z-index:7;display:none}
body.mail #mail{display:block}
#mail .dim{position:absolute;inset:0;background:rgba(20,16,35,.38)}
.msheet{position:absolute;left:27cqw;width:46cqw;top:4.6cqw;height:46cqw;background:#fbf6ea;color:#3b2f45;border-radius:0 0 .3cqw .3cqw;
  box-shadow:0 1.6cqw 2.6cqw -1cqw rgba(10,8,25,.65);display:flex;flex-direction:column;padding:1.7cqw 2cqw 1.1cqw;animation:ldrop .55s cubic-bezier(.22,1,.36,1)}
.msheet::before{content:'';position:absolute;left:-.7cqw;right:-.7cqw;top:-.55cqw;height:1.1cqw;border-radius:.55cqw;background:linear-gradient(180deg,#d1b089,#9c7a56);box-shadow:0 1px 2px rgba(30,20,40,.4)}
@keyframes ldrop{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.mh{font-family:Iansui,serif;font-size:clamp(18px,1.5cqw,26px);letter-spacing:.08em}
.msub{font-family:Iansui,serif;font-size:clamp(12px,.9cqw,15px);color:#8a7a92;margin-top:.3cqw;line-height:1.6}
.mclose{position:absolute;right:1.2cqw;top:1cqw;font-family:Iansui,serif;font-size:clamp(17px,1.4cqw,24px);color:#9a7f99;cursor:pointer;z-index:1}
.mclose:hover{color:#8a4f78}
.mrows{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;margin-top:.9cqw;padding-right:.3cqw}
.env{display:flex;align-items:center;gap:1cqw;padding:.75cqw .5cqw;border-bottom:1px dashed #e3d7bd}
.env .ic{flex:none;width:3.2cqw;height:2.2cqw;position:relative;border-radius:.15cqw;background:#efe2c4;box-shadow:.5px 1px 1.5px rgba(30,20,40,.3)}
.env .ic::before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,transparent 49%,rgba(150,120,90,.45) 50%,transparent 51%),linear-gradient(20deg,transparent 49%,rgba(150,120,90,.45) 50%,transparent 51%);background-size:100% 100%}
.env .ic::after{content:'';position:absolute;left:50%;top:48%;width:.8cqw;height:.8cqw;translate:-50% -50%;border-radius:50%;background:#c4473d;box-shadow:0 1px 1px rgba(0,0,0,.3)}
.env.ready .ic{background:#fff3d6;box-shadow:0 0 1.2cqw rgba(255,214,120,.9),.5px 1px 1.5px rgba(30,20,40,.3);animation:glowp 1.8s ease-in-out infinite}
@keyframes glowp{50%{box-shadow:0 0 .4cqw rgba(255,214,120,.5),.5px 1px 1.5px rgba(30,20,40,.3)}}
.env.opened .ic::after{background:#d8c3a0}
.env.locked{opacity:.55}
.env.locked .ic::after{background:#9a8a7a}
.env .m{flex:1;min-width:0}
.env .no{font-family:Iansui,serif;font-size:clamp(12px,.9cqw,15px);color:#9a7f6a;letter-spacing:.06em}
.env .tt{font-size:clamp(15px,1.12cqw,19px);color:#3b2f45;line-height:1.45}
.env .tr{font-size:clamp(13px,.95cqw,16px);color:#7a6a82;line-height:1.55;margin-top:.1cqw}
.env .st{font-family:Iansui,serif;font-size:clamp(12px,.85cqw,14px);color:#a8846a;margin-top:.15cqw}
.mbtn{flex:none;font-family:Iansui,serif;font-size:clamp(13px,.95cqw,16px);background:#fffaf1;border:1px solid #c9b6c9;border-radius:999px;padding:.3cqw 1.1cqw;cursor:pointer;color:#6a5470;white-space:nowrap}
.mbtn:hover{border-color:#8a4f78;color:#8a4f78}
.mbtn.go{background:#a85a63;border-color:#a85a63;color:#fff}
.mmore{font-family:Iansui,serif;text-align:center;color:#a898ae;padding:1cqw 0;cursor:pointer;font-size:clamp(12px,.9cqw,15px)}

#reader{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(20,16,35,.45)}
body.reading #reader{display:flex}
.rpaper{position:relative;width:min(50cqw,820px);max-height:47cqw;overflow:auto;scrollbar-width:thin;background:#fdf8ec;color:#33283d;border-radius:.3cqw;padding:2.6cqw 3.2cqw 2cqw;
  box-shadow:0 2cqh 4cqh -1.5cqh rgba(10,8,25,.7);animation:unfold .6s cubic-bezier(.22,1,.36,1);
  background-image:repeating-linear-gradient(180deg,transparent 0 2.4cqw,rgba(180,150,120,.16) 2.4cqw calc(2.4cqw + 1px));background-position:0 5.4cqw}
@keyframes unfold{from{transform:scaleY(.08) translateY(-8cqw);opacity:.3}to{transform:none;opacity:1}}
.rpaper h3{font-family:Iansui,serif;font-weight:400;font-size:clamp(22px,1.9cqw,32px);letter-spacing:.08em;color:#6a3d5e}
.rpaper .rb p{font-size:clamp(16px,1.2cqw,21px);line-height:2.4cqw;min-height:2.4cqw;margin-top:1.2cqw;white-space:normal;overflow-wrap:anywhere}
.rpaper .rf{display:flex;justify-content:space-between;align-items:center;gap:1cqw;margin-top:2cqw;font-family:Iansui,serif;font-size:clamp(12px,.9cqw,15px);color:#9a7f6a}


#form{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(20,16,35,.38)}
#form.show{display:flex;animation:ffade .25s ease}
@keyframes ffade{from{background:rgba(20,16,35,0)}to{background:rgba(20,16,35,.38)}}
.vform{position:relative;width:min(36cqw,580px);background:#fbf6ec;color:#3b2f45;border-radius:3px;padding:1.7cqw 2cqw 1.4cqw;box-shadow:0 2cqh 4cqh -1.5cqh rgba(10,8,25,.7);animation:vdrop .4s cubic-bezier(.22,1,.36,1)}
@keyframes vdrop{from{opacity:0;translate:0 -3cqh;scale:.95}to{opacity:1;translate:0 0;scale:1}}
.vform h2{font-family:Iansui,serif;font-weight:400;font-size:clamp(18px,1.5cqw,26px);letter-spacing:.1em}
.vform .sub{font-family:Iansui,serif;font-size:clamp(12px,.9cqw,15px);color:#8a7a92;margin:.3cqw 0 .6cqw;line-height:1.7}
.vform input{width:100%;font-family:"LXGW WenKai TC","Noto Serif TC",serif;font-size:clamp(15px,1.1cqw,19px);color:#3b2f45;background:#f6efdd;border:1px solid #ddcfa8;border-radius:6px;padding:.7cqh .9cqw;outline:none;margin-top:1cqh}
.vform input:focus{border-color:#b48aa8;background:#fffaf0}
.vform .chips{display:flex;flex-wrap:wrap;gap:.45cqw;margin-top:1cqh}
.chip{font-family:Iansui,serif;font-size:clamp(12px,.9cqw,15px);line-height:1.6;background:#fffaf1;border:1px solid #c9b6c9;border-radius:999px;padding:0 .8cqw;cursor:pointer;color:#6a5470;white-space:nowrap;user-select:none}
.chip:hover{border-color:#8a4f78;color:#8a4f78}
.vform .acts{display:flex;justify-content:flex-end;align-items:center;gap:.6cqw;margin-top:2cqh}
.vform .note{font-family:Iansui,serif;font-size:clamp(12px,.9cqw,15px);color:#a0413a;margin-top:1cqh;min-height:1em}
.fbtn{font-family:Iansui,serif;font-size:clamp(13px,1cqw,17px);background:#fffaf1;border:1px solid #c9b6c9;border-radius:999px;padding:.45cqh 1.3cqw;cursor:pointer;color:#4a3a55}
.fbtn.plant{background:#a85a63;border-color:#a85a63;color:#fff}
.spark{position:absolute;z-index:9;pointer-events:none;color:#ffe9a8;font-size:clamp(10px,1cqw,18px);text-shadow:0 0 .6cqw rgba(255,226,150,.9)}


.curtain{position:absolute;top:0;bottom:0;width:51%;z-index:8;transition:transform .75s cubic-bezier(.65,0,.35,1);
  background:repeating-linear-gradient(90deg,#6e4a6c 0 2.2cqw,#845d81 2.2cqw 3.4cqw,#6e4a6c 3.4cqw 4.4cqw);box-shadow:inset 0 -1.4cqh 0 #c9a24e}
.curtain::after{content:'';position:absolute;inset:0;background:url(art/paper-qq.webp) center/700px auto;mix-blend-mode:multiply;opacity:.18}
.curtain.l{left:0;transform:translateX(-100%)}
.curtain.r{right:0;transform:translateX(100%)}
.stage.closed .curtain{transform:none}
#frameStars{position:absolute;inset:0;width:100%;height:100%;z-index:10;pointer-events:none}
#frameStars .hot{pointer-events:auto;cursor:pointer}
#frameStars .tag{opacity:0;transition:opacity .2s}
#frameStars .on .tag{opacity:1}
#toast{position:absolute;left:50%;bottom:9%;translate:-50% 0;z-index:9;font-family:Iansui,serif;font-size:clamp(13px,1cqw,17px);background:#f7efdf;color:#4a3a55;border:1px solid #9a7f99;border-radius:4px;padding:.7cqh 1.3cqw;box-shadow:.5px 1.5px 2px rgba(26,20,48,.35);opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="stage closed" id="stage">
  <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="paper" x="-3%" y="-3%" width="106%" height="112%">
        <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="7" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0" result="mono"/>
        <feComposite in="mono" in2="SourceGraphic" operator="in" result="t"/>
        <feBlend in="SourceGraphic" in2="t" mode="soft-light" result="tex"/>
        <feComposite in="tex" in2="SourceGraphic" operator="arithmetic" k2="0" k3="1" result="p"/>
        <feDropShadow in="p" dx="0" dy="3" stdDeviation="3" flood-color="#0a0b1c" flood-opacity=".35"/>
      </filter>
      <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="glowB" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
      <filter id="pshadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx=".5" dy="1.2" stdDeviation=".9" flood-color="#1a1430" flood-opacity=".3"/></filter>
      <filter id="rim" x="-20%" y="-20%" width="140%" height="140%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="1.7" result="d"/>
        <feFlood id="rimFlood" flood-color="#ffd98c" flood-opacity="0"/>
        <feComposite in2="d" operator="in" result="glowShape"/>
        <feGaussianBlur in="glowShape" stdDeviation="2.8" result="g"/>
        <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <radialGradient id="lightGrad" gradientUnits="userSpaceOnUse" cx="1160" cy="580" r="1150">
        <stop offset="0" stop-color="#fff4cf"/><stop offset=".18" stop-color="#f6c477"/>
        <stop offset=".42" stop-color="#c47aa6"/><stop offset=".7" stop-color="#4b3a86"/>
        <stop offset="1" stop-color="#151a44"/>
      </radialGradient>
      <mask id="moonCapMask"><circle r="92" fill="#fff"/><circle cx="36" cy="-22" r="88" fill="#000"/></mask>
    </defs>
  </svg>
  <div id="starfall"></div>
  <svg id="fore" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"></svg>
  <div id="paperDay"></div><div id="paperNight"></div>
  <div id="htag"><b></b><span></span></div>
  <div id="mail"></div>
  <div id="reader"></div>
  <div id="form"></div>
  <div id="toast"></div>
  <div class="curtain l"></div><div class="curtain r"></div>
  <img class="frame" src="art/stage/frame-v2.webp" alt="">
  <svg id="frameStars" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="starLine" x="-40%" y="-40%" width="180%" height="180%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="2.2" result="d"/>
        <feComposite in="d" in2="SourceAlpha" operator="out" result="ring"/>
        <feFlood flood-color="#ffe6a6" flood-opacity=".95"/>
        <feComposite in2="ring" operator="in" result="line"/>
        <feGaussianBlur in="line" stdDeviation="1.2" result="gl"/>
        <feMerge><feMergeNode in="gl"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>
</div>
