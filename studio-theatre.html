<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="guest.css">
<script src="guest.js"></script>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作室 · 紙劇場樣本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iansui&family=LXGW+WenKai+TC:wght@400&family=Noto+Serif+TC:wght@400;500&display=swap">
<style>

:root{--paper-day:.05;--paper-night:.08;--paper-size:800px;--n:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#3a2f4f;font-family:"LXGW WenKai TC","Noto Serif TC",serif}
button{font:inherit;color:inherit}
.stage{position:absolute;left:50%;top:50%;width:min(100vw,177.78vh);height:min(56.25vw,100vh);transform:translate(-50%,-50%);container-type:size;overflow:hidden;background:#4d3d60;touch-action:none}
.stage>svg,.stage>.frame{position:absolute;inset:0;width:100%;height:100%;display:block}
.frame{pointer-events:none;z-index:9}
#scene image{pointer-events:none}
#paperDay,#paperNight{position:absolute;inset:0;pointer-events:none;background:url(art/paper-qq.webp) center/var(--paper-size) auto repeat;z-index:4}
#paperDay{mix-blend-mode:multiply;opacity:calc(var(--paper-day) * (1 - var(--n)))}
#paperNight{mix-blend-mode:overlay;opacity:calc(var(--paper-night) * var(--n))}
.plateText{font-family:Iansui,serif}
#starfall{position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;opacity:0}
#starfall>div{position:absolute}
#fore{z-index:4;pointer-events:none}


#wall{position:absolute;inset:0;z-index:2;pointer-events:none;filter:brightness(calc(1 - .3 * var(--n))) saturate(calc(1 - .2 * var(--n)));transition:opacity .4s}
body.open #wall{opacity:.3}
.roll{position:absolute;pointer-events:auto;cursor:pointer;transform-origin:50% 0;border-radius:.25cqw .25cqw .4cqw .4cqw;will-change:transform;
  background:linear-gradient(90deg,rgba(20,30,70,.35) 0,rgba(255,255,255,.18) 18%,rgba(255,255,255,.06) 34%,transparent 55%,rgba(20,30,70,.28) 100%),var(--bc);
  box-shadow:.5px 1.5px 2px rgba(26,20,48,.4),0 .6cqw .9cqw -.5cqw rgba(10,8,25,.45);display:flex;flex-direction:column;align-items:center;padding:1.3cqw 0 .8cqw}
.roll::before{content:'';position:absolute;left:0;right:0;top:-.28cqw;height:.62cqw;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,#3f5487 0 22%,#e9eef8 24% 34%,var(--bc) 36% 100%);box-shadow:inset 0 -1px 0 rgba(0,0,0,.2)}
.roll::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:url(art/paper-qq.webp) center/420px auto;mix-blend-mode:multiply;opacity:.2}
.roll .rb{position:absolute;left:-.12cqw;right:-.12cqw;top:1.1cqw;height:.55cqw;background:var(--tc);box-shadow:0 1px 1px rgba(30,20,40,.3)}
.roll .lbl{flex:1;margin-top:.75cqw;writing-mode:vertical-rl;text-orientation:mixed;font-family:Iansui,serif;font-size:clamp(10px,.86cqw,15px);letter-spacing:.06em;
  color:#f7f4ea;text-shadow:0 1px 1px rgba(20,25,60,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%;z-index:1}
.roll.gone,.box.gone,.droll.gone{visibility:hidden}

.roll.short{padding:.8cqw 0 .5cqw}
.roll.short .rb{top:.55cqw;height:.45cqw}
.roll.short .lbl{margin-top:.5cqw}
.roll.add{display:none;background:rgba(255,250,240,.12);border:2px dashed rgba(255,250,240,.85);box-shadow:none}
.roll.add::before,.roll.add::after{display:none}
.roll.add .lbl{color:#fffaf0}
body.tools .roll.add{display:flex}

.box{position:absolute;pointer-events:auto;cursor:pointer;border-radius:.15cqw;background:linear-gradient(180deg,#d6b48a 0 16%,#c9a57a 16% 100%);
  box-shadow:.5px 1.5px 2px rgba(26,20,48,.4),inset 0 -.25cqw 0 rgba(0,0,0,.08);transition:translate .25s}
.box::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:url(art/paper-qq.webp) center/380px auto;mix-blend-mode:multiply;opacity:.25}
.box .tape{position:absolute;left:44%;width:12%;top:0;height:16%;background:rgba(240,226,190,.75)}
.box .lb{position:absolute;left:8%;right:8%;top:30%;bottom:14%;background:#fbf6ea;border-radius:1px;display:flex;align-items:center;justify-content:center;padding:0 .3cqw;
  font-family:Iansui,serif;font-size:clamp(9px,.7cqw,12px);color:#5a4a3a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box .lb span{overflow:hidden;text-overflow:ellipsis}
.box:hover{translate:-.5cqw 0}

.box{filter:brightness(calc(1 - .38 * var(--n))) saturate(calc(1 - .3 * var(--n)))}

.droll{position:absolute;pointer-events:auto;cursor:pointer;transform-origin:50% 100%;border-radius:.3cqw .3cqw 0 0;
  background:linear-gradient(90deg,rgba(20,30,70,.3),rgba(255,255,255,.15) 30%,transparent 60%,rgba(20,30,70,.25)),var(--bc);box-shadow:.5px 1px 1.5px rgba(26,20,48,.35)}
.droll::before{content:'';position:absolute;left:0;right:0;top:-.2cqw;height:.42cqw;border-radius:50%;background:radial-gradient(ellipse at 50% 50%,#3f5487 0 24%,#e9eef8 26% 38%,var(--bc) 40% 100%)}
.droll .rb{position:absolute;left:-.15cqw;right:-.15cqw;top:14%;height:.42cqw;background:var(--tc)}
.droll .bow{position:absolute;left:50%;top:13%;width:.9cqw;height:.6cqw;translate:-50% 0;background:var(--tc);clip-path:polygon(0 0,50% 40%,100% 0,100% 100%,50% 60%,0 100%)}

#list{position:absolute;inset:0;z-index:7;display:none}
body.listing #list{display:block}
#list .dim{position:absolute;inset:0;background:rgba(20,16,35,.35)}
#lsheet{position:absolute;left:29cqw;width:42cqw;top:4.6cqw;height:46cqw;background:#fbf6ea;color:#3b2f45;border-radius:0 0 .3cqw .3cqw;
  box-shadow:0 1.6cqw 2.6cqw -1cqw rgba(10,8,25,.65);display:flex;flex-direction:column;padding:1.6cqw 1.8cqw 1cqw;animation:ldrop .55s cubic-bezier(.22,1,.36,1)}
#lsheet::before{content:'';position:absolute;left:-.7cqw;right:-.7cqw;top:-.55cqw;height:1.1cqw;border-radius:.55cqw;background:linear-gradient(180deg,#d1b089,#9c7a56);box-shadow:0 1px 2px rgba(30,20,40,.4)}
#lsheet::after{content:'';position:absolute;inset:0;pointer-events:none;background:url(art/paper-qq.webp) center/600px auto;mix-blend-mode:multiply;opacity:.12}
@keyframes ldrop{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.lh2{font-family:Iansui,serif;font-size:clamp(16px,1.35cqw,24px);letter-spacing:.08em;display:flex;align-items:baseline;gap:.6cqw}
.lh2 small{font-size:.6em;color:#9a8aa4}
.lclose{position:absolute;right:1.1cqw;top:1cqw;font-family:Iansui,serif;font-size:clamp(16px,1.3cqw,22px);color:#9a7f99;cursor:pointer;z-index:1}
.lclose:hover{color:#8a4f78}
.ltabs{display:flex;gap:.4cqw;flex-wrap:wrap;margin-top:.7cqw}
.lsearch{margin-top:.7cqw}
.lsearch input{width:100%;font-family:"LXGW WenKai TC",serif;font-size:clamp(13px,.95cqw,16px);background:#f6efdd;color:#3b2f45;border:1px solid #ddcfa8;border-radius:6px;padding:.4cqw .8cqw;outline:none}
.lsearch input:focus{border-color:#b48aa8;background:#fffaf0}
.lrows{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;margin-top:.6cqw;padding-right:.3cqw}
.lr{display:flex;align-items:center;gap:.8cqw;padding:.55cqw .4cqw;border-bottom:1px dashed #e3d7bd;cursor:pointer;border-radius:.2cqw}
.lr:hover{background:rgba(180,138,168,.1)}
.lr .dot{width:.75cqw;height:2.2cqw;border-radius:.2cqw;background:linear-gradient(90deg,rgba(20,30,70,.3),transparent 60%),var(--bc);flex:none;position:relative}
.lr .dot::after{content:'';position:absolute;left:-.1cqw;right:-.1cqw;top:.35cqw;height:.3cqw;background:var(--tc)}
.lr .m{flex:1;min-width:0}
.lr .t{font-size:clamp(13px,1cqw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .s{font-family:Iansui,serif;font-size:clamp(10px,.74cqw,13px);color:#9a8aa4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lempty{font-family:Iansui,serif;color:#a898ae;text-align:center;padding:3cqw 0;font-size:clamp(13px,1cqw,17px)}

#htag{position:absolute;z-index:8;pointer-events:none;opacity:0;transition:opacity .15s;translate:-50% 0;max-width:22cqw;
  background:#f7efdf;border:1px solid #9a7f99;border-radius:4px;padding:.45cqw .8cqw;box-shadow:.5px 1.5px 2px rgba(26,20,48,.35);text-align:center}
#htag.show{opacity:1}
#htag b{display:block;font-family:Iansui,serif;font-weight:400;font-size:clamp(12px,.95cqw,16px);color:#3b2f45;line-height:1.35}
#htag span{display:block;font-family:Iansui,serif;font-size:clamp(10px,.75cqw,13px);color:#8a7a92;margin-top:.15cqw}


#bpWrap{position:absolute;left:11.875cqw;top:6.25cqw;width:72.5cqw;height:40.625cqw;z-index:6;display:none}
body.open #bpWrap{display:block}
#bp{position:absolute;inset:0;border-radius:.2cqw;color:#f4f0e4;overflow:hidden;
  background:repeating-linear-gradient(0deg,transparent 0 1.6cqw,rgba(235,242,255,.07) 1.6cqw calc(1.6cqw + 1px)),repeating-linear-gradient(90deg,transparent 0 1.6cqw,rgba(235,242,255,.07) 1.6cqw calc(1.6cqw + 1px)),
    radial-gradient(ellipse at 30% 20%,#6880b5,#5670a6 60%,#4c6497);box-shadow:0 1.6cqw 2.6cqw -1cqw rgba(10,8,25,.65)}
#bp::before{content:'';position:absolute;inset:1cqw;border:1px dashed rgba(240,236,224,.45);border-radius:.15cqw;pointer-events:none}
#bp::after{content:'';position:absolute;inset:0;pointer-events:none;background:url(art/paper-qq.webp) center/700px auto;mix-blend-mode:multiply;opacity:.22}

#curl{position:absolute;top:-.3cqw;bottom:-.3cqw;width:2.6cqw;left:0;display:none;z-index:2;border-radius:1.3cqw;
  background:linear-gradient(90deg,#3d5287 0,#6d86bb 30%,#8fa5d2 45%,#5f78ad 70%,#3d5287 100%);box-shadow:.4cqw .3cqw .8cqw rgba(10,8,25,.45)}
.flyroll{position:absolute;z-index:7;pointer-events:none;border-radius:.4cqw;
  background:linear-gradient(90deg,#3d5287 0,#6d86bb 30%,#8fa5d2 45%,#5f78ad 70%,#3d5287 100%);box-shadow:.4cqw .4cqw .9cqw rgba(10,8,25,.4)}
.flyroll .rb{position:absolute;left:0;right:0;top:22%;height:.55cqw;background:var(--tc)}

.bpIn{position:absolute;inset:2cqw 2.4cqw 1.8cqw;display:flex;flex-direction:column;z-index:1}
.bp-kind{font-family:Iansui,serif;font-size:clamp(10px,.8cqw,14px);letter-spacing:.12em;color:#c9d4ee;display:flex;align-items:center;gap:.6cqw}
.bp-kind .tp{color:#2f2840;background:var(--tc);border-radius:999px;padding:0 .6cqw;letter-spacing:.08em}
.bp-title{font-family:Iansui,serif;font-size:clamp(18px,1.9cqw,33px);line-height:1.25;margin-top:.25cqw;padding-right:12cqw;text-shadow:0 1px 1px rgba(20,25,60,.35)}
.bp-blurb{font-size:clamp(12px,.92cqw,16px);color:#d5ddf0;line-height:1.55;margin-top:.3cqw;padding-right:12cqw;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.stamp{position:absolute;right:2.2cqw;top:1.1cqw;width:7cqw;height:7cqw;border-radius:50%;border:.26cqw solid var(--sc);color:var(--sc);rotate:-12deg;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Iansui,serif;opacity:.9;mix-blend-mode:screen}
.stamp::before{content:'';position:absolute;inset:.45cqw;border-radius:50%;border:1px solid var(--sc)}
.stamp b{font-weight:400;font-size:clamp(14px,1.3cqw,23px);letter-spacing:.1em}
.stamp span{font-size:clamp(8px,.56cqw,10px);letter-spacing:.16em;margin-top:.1cqw}
.stamp.s-active{--sc:#f2b7a4}.stamp.s-idea{--sc:#f6e4a2}.stamp.s-paused{--sc:#c9d2e4}.stamp.s-done{--sc:#ff8f86}

.ruler{position:relative;margin-top:1.1cqw;height:4.6cqw;flex:none}
.ruler .wood{position:absolute;left:0;right:0;top:1.5cqw;height:2.3cqw;border-radius:.2cqw;background:#efe2bd;box-shadow:.5px 1.5px 2px rgba(10,15,40,.4);overflow:hidden}
.ruler .wood::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(90,70,40,.5) 0 1px,transparent 1px .8cqw);background-size:.8cqw .55cqw;background-repeat:repeat-x;opacity:.7}
.ruler .wood::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(90,70,40,.55) 0 1px,transparent 1px 4cqw);background-size:4cqw .9cqw;background-repeat:repeat-x}
.ruler .hl{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,rgba(255,214,96,.0),rgba(255,206,84,.55) 40%,rgba(255,206,84,.5) 75%,rgba(255,214,96,0));transition:width .5s}
.ruler .tk{position:absolute;top:1.5cqw;height:2.3cqw;translate:-50% 0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:5cqw}
.ruler .tk b{font-family:Iansui,serif;font-weight:400;font-size:clamp(12px,1cqw,17px);color:#5a4630;line-height:1.15}
.ruler .tk span{font-family:Iansui,serif;font-size:clamp(9px,.66cqw,12px);color:#8a7458;line-height:1.1}
.ruler .tk.cur b{color:#a2352d}
.ruler .tk.on b{color:#4a3824}
body.tools .ruler .tk{cursor:pointer}
body.tools .ruler .tk:hover b{text-decoration:underline}
.ruler .pin{position:absolute;top:-.1cqw;translate:-50% 0;font-family:Iansui,serif;font-size:clamp(10px,.78cqw,13px);color:#ffd9cf;white-space:nowrap;transition:left .5s}
.ruler .pin::after{content:'';display:block;margin:.1cqw auto 0;width:0;border-left:.42cqw solid transparent;border-right:.42cqw solid transparent;border-top:.55cqw solid #e2685c}
.bpBody{flex:1;display:flex;gap:2cqw;margin-top:1cqw;min-height:0}
.colL{flex:1.55;display:flex;flex-direction:column;min-width:0}
.lh{font-family:Iansui,serif;font-size:clamp(11px,.85cqw,15px);letter-spacing:.18em;color:#c9d4ee;margin-bottom:.4cqw;display:flex;align-items:baseline;gap:.6cqw}
.lh small{letter-spacing:.05em;color:#aebbe0}

.latest{position:relative;background:#fbf7ec;color:#3b2f45;border-radius:.15cqw;padding:1.1cqw 1.3cqw 1cqw;box-shadow:.5px 2px 3px rgba(10,15,40,.4);rotate:-.4deg;flex:none;max-height:13.5cqw;overflow:auto;scrollbar-width:thin}
.latest::before{content:'';position:absolute;left:50%;top:-.55cqw;width:5.5cqw;height:1.1cqw;translate:-50% 0;rotate:2deg;background:rgba(232,198,152,.8)}
.latest p{font-size:clamp(13px,1.02cqw,18px);line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.latest .none{font-family:Iansui,serif;color:#a898ae;text-align:center}
.logs{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;margin-top:.3cqw;padding-right:.4cqw;
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 1.5cqw),transparent);mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 1.5cqw),transparent);padding-bottom:1.2cqw}
.lg{display:flex;gap:.9cqw;padding:.45cqw 0;border-bottom:1px dashed rgba(230,236,250,.22);font-size:clamp(13px,.98cqw,17px);line-height:1.6;cursor:pointer}
.lg .d{font-family:Iansui,serif;font-size:.85em;color:#aebbe0;flex:none;min-width:6.4em}
.lg .t{flex:1;color:#ebeff8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.lg.full .t{display:block}
.lg .x{display:none;flex:none;font-family:Iansui,serif;font-size:.85em;color:#ffcfc6;cursor:pointer}
body.tools .lg .x{display:block}
.lgAdd{display:none;gap:.5cqw;margin:.6cqw 0 .2cqw}
body.tools .lgAdd{display:flex}
.lgAdd input{flex:1;font-family:"LXGW WenKai TC",serif;font-size:clamp(12px,.92cqw,16px);background:#fbf7ec;color:#3b2f45;border:1px solid #d9cfb2;border-radius:6px;padding:.35cqw .7cqw;outline:none}

.clip{flex:1;position:relative;display:flex;flex-direction:column;min-width:0;background:#b48f6c;border-radius:.5cqw;padding:2cqw .9cqw .9cqw;box-shadow:.5px 2px 3px rgba(10,15,40,.45);rotate:.5deg}
.clip::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:url(art/paper-qq.webp) center/400px auto;mix-blend-mode:multiply;opacity:.25}
.clip .metal{position:absolute;left:50%;top:-.5cqw;width:7cqw;height:2.2cqw;translate:-50% 0;border-radius:.4cqw .4cqw .3cqw .3cqw;background:linear-gradient(180deg,#e9e5dc,#b9b4aa 60%,#d8d3c9);box-shadow:0 1px 2px rgba(20,20,30,.4);z-index:2}
.clip .metal::after{content:'';position:absolute;left:50%;top:.45cqw;width:2.2cqw;height:.6cqw;translate:-50% 0;border-radius:999px;background:#8c877d}
.sheet{position:relative;flex:1;min-height:0;background:#fbf7ec;color:#3b2f45;border-radius:.15cqw;padding:1.3cqw 1cqw .6cqw;display:flex;flex-direction:column;z-index:1}
.ckTop{display:flex;align-items:center;gap:.7cqw;font-family:Iansui,serif;font-size:clamp(12px,.92cqw,16px);flex:none}
.ckTop .bar{flex:1;height:.55cqw;border-radius:999px;background:#ebe2cc;overflow:hidden}
.ckTop .bar i{display:block;height:100%;background:#8fae8a;border-radius:inherit}
.ckList{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;margin-top:.6cqw;padding-right:.3cqw}
.ckG{margin-bottom:.6cqw}
.ckG .gh{display:flex;align-items:baseline;gap:.5cqw;font-family:Iansui,serif;font-size:clamp(11px,.82cqw,14px);color:#9a7f6a;border-bottom:1px solid #eadfc6;padding-bottom:.1cqw;margin-bottom:.2cqw}
.ckG .gh .n{margin-left:auto;font-size:.9em}
.ckG.cur .gh{color:#a2352d}
.ckG.cur .gh::after{content:'← 現在';font-size:.85em}
.ck{display:flex;align-items:flex-start;gap:.5cqw;padding:.2cqw 0;font-size:clamp(13px,.96cqw,16px);line-height:1.5}
.ck .bx{flex:none;width:1.05cqw;height:1.05cqw;margin-top:.25cqw;border:1.5px solid #9a8a78;border-radius:.15cqw;display:flex;align-items:center;justify-content:center;font-size:.8em;color:#6f8f6a;background:#fff}
.ck.done .bx{border-color:#8fae8a}
.ck.done .t{color:#a89c90;text-decoration:line-through;text-decoration-color:rgba(120,110,100,.5)}
.ck .t{flex:1;overflow-wrap:anywhere}
.ck .due{flex:none;font-family:Iansui,serif;font-size:.8em;color:#9a8a78;border:1px solid #d8ccb4;border-radius:999px;padding:0 .4cqw;margin-top:.15cqw}
.ck .due.late{color:#b2453b;border-color:#e3b3ab}
.ck .ed,.ck .x{display:none;flex:none;font-family:Iansui,serif;font-size:.8em;color:#8a4f78;cursor:pointer;margin-top:.15cqw}
.ck .x{color:#a0413a}
body.tools .ck .ed,body.tools .ck .x{display:block}
body.tools .ck .bx{cursor:pointer}
body.tools .ck .bx:hover{border-color:#6f8f6a}
.ckEmpty{font-family:Iansui,serif;color:#a898ae;text-align:center;padding:1.4cqw 0;font-size:clamp(12px,.9cqw,15px)}
.ckAdd{display:none;flex-direction:column;gap:.35cqw;margin-top:.5cqw;flex:none;border-top:1px dashed #e0d4b8;padding-top:.45cqw}
body.tools .ckAdd{display:flex}
.ckAdd .r{display:flex;gap:.4cqw}
.ckAdd input{flex:1;min-width:0;font-family:"LXGW WenKai TC",serif;font-size:clamp(11px,.85cqw,14px);background:#f6efdd;color:#3b2f45;border:1px solid #ddcfa8;border-radius:5px;padding:.25cqw .5cqw;outline:none}
.ckAdd input[type=date]{flex:none;width:9.5cqw}

open");if(want){const G=GROUPS();const p=/^\d+$/.test(want)?G.active[+want-1]:PROJ.find(x=>x.title.includes(want));if(p)setTimeout(()=>{openBP(p,findEl(p));if(q.get("notes"))showNotes(true);if(q.get("done"))setTimeout(()=>projAct("done"),100);const fm={project:()=>projectForm(OPEN),new:()=>projectForm(null),note:()=>noteForm(null),file:()=>fileForm(),item:()=>itemForm(OPEN.checklist[0])}[q.get("form")];if(fm)setTimeout(fm,100)},SHOT?50:700)}}async function starData(){try{return await(await fetch("Starfall.json")).json()}catch(e){return null}}async function starfall(){if(!window.lottie)return;const data=await starData();if(!data)return;for(const[x,y,sc]of[[90,160,1],[1290,120,1.05],[1400,360,.85]]){const d=document.createElement("div");Object.assign(d.style,{left:x/16+"cqw",top:y/16+"cqw",width:243*sc/16+"cqw",height:297*sc/16+"cqw"});$("#starfall").append(d);const a=lottie.loadAnimation({container:d,renderer:"svg",loop:true,autoplay:false,animationData:data});a.goToAndPlay(Math.floor(Math.random()*157),true)}}applySky();setInterval(applySky,2e4);load();if(!q.get("nofall"))starfall();requestAnimationFrame(frame);addEventListener("pageshow",e=>{if(e.persisted)location.reload()});
