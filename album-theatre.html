<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="guest.css">
<script src="guest.js"></script>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相冊本 · 紙劇場樣本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iansui&family=LXGW+WenKai+TC:wght@400&family=Noto+Serif+TC:wght@400;500&display=swap">
<style>

:root{--paper-day:.05;--paper-night:.08;--paper-size:800px;--n:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#3a2f4f;font-family:"LXGW WenKai TC","Noto Serif TC",serif}
button{font:inherit;color:inherit}
.stage{position:absolute;left:50%;top:50%;width:min(100vw,177.78vh);height:min(56.25vw,100vh);transform:translate(-50%,-50%);container-type:size;overflow:hidden;background:#4d3d60;touch-action:none}
.stage>svg,.stage>.frame{position:absolute;inset:0;width:100%;height:100%;display:block}
.frame{pointer-events:none;z-index:9}
#scene image{pointer-events:none}
#paperDay,#paperNight{position:absolute;inset:0;pointer-events:none;background:url(art/paper-qq.webp) center/var(--paper-size) auto repeat;z-index:4}
#paperDay{mix-blend-mode:multiply;opacity:calc(var(--paper-day) * (1 - var(--n)))}
#paperNight{mix-blend-mode:overlay;opacity:calc(var(--paper-night) * var(--n))}
.plateText{font-family:Iansui,serif}
#starfall{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;opacity:0}
#starfall>div{position:absolute}


#line{position:absolute;inset:0;z-index:3;pointer-events:none}
#fore{z-index:4;pointer-events:none}
.pol{position:absolute;left:0;top:0;width:12.5cqw;transform-origin:50% 0;pointer-events:auto;cursor:pointer;will-change:transform}
.pol .paper{position:relative;margin-top:.9cqw;background:#fbf6ec;padding:.7cqw .7cqw 0;border-radius:2px;
  box-shadow:.5px 1.5px 2px rgba(26,20,48,.3),0 1.2cqw 1.6cqw -1cqw rgba(10,8,25,.55)}
.pol .paper::after{content:'';position:absolute;inset:0;border-radius:2px;pointer-events:none;background:url(art/paper-qq.webp) center/500px auto;mix-blend-mode:multiply;opacity:.12}
.pol .win{width:100%;aspect-ratio:1;background:#e6dccb;overflow:hidden}
.pol img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s ease}
.pol img.ok{opacity:1}
.pol .cap{font-family:Iansui,serif;font-size:clamp(10px,.82cqw,15px);color:#4a3a55;line-height:1.3;padding:.5cqw .1cqw .6cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pol .pencil{position:absolute;right:.5cqw;bottom:.45cqw;font-size:clamp(9px,.7cqw,12px);color:#b49a7a}

.pins{position:absolute;left:0;right:0;top:0;display:flex;justify-content:center;gap:2.2cqw;z-index:2}
.pin{width:.9cqw;height:2.1cqw;border-radius:2px;background:var(--pc);box-shadow:inset -2px 0 0 rgba(0,0,0,.12),.5px 1px 1.5px rgba(26,20,48,.4)}
.pin::after{content:'';display:block;width:100%;height:2px;margin-top:.8cqw;background:rgba(255,255,255,.35)}

body.night .pol .paper{box-shadow:.5px 1.5px 2px rgba(26,20,48,.3),0 1.2cqw 1.6cqw -1cqw rgba(10,8,25,.55),0 0 2.4cqw rgba(255,214,140,.22)}


#viewer{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(20,16,35,.38);perspective:180cqw}
#viewer.show{display:flex;animation:vfade .25s ease}
@keyframes vfade{from{background:rgba(20,16,35,0)}to{background:rgba(20,16,35,.38)}}
.vcard{position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.3,1);animation:vdrop .45s cubic-bezier(.22,1,.36,1)}
@keyframes vdrop{from{opacity:0;translate:0 -3cqh;scale:.9}to{opacity:1;translate:0 0;scale:1}}
.vcard.flipped{transform:rotateY(180deg)}
.vface{background:#fbf6ec;padding:1.1cqw 1.1cqw 0;border-radius:3px;backface-visibility:hidden;box-shadow:0 2cqh 4cqh -1.5cqh rgba(10,8,25,.7)}
.vface::after{content:'';position:absolute;inset:0;border-radius:3px;pointer-events:none;background:url(art/paper-qq.webp) center/600px auto;mix-blend-mode:multiply;opacity:.12}
.vface img{display:block;max-width:44cqw;max-height:56cqh;object-fit:contain}

.vface .vcap{width:0;min-width:100%;font-family:Iansui,serif;font-size:clamp(14px,1.25cqw,22px);line-height:1.5;color:#3b2f45;padding:1cqw .2cqw .3cqw;overflow-wrap:anywhere}
.vface .vmeta{width:0;min-width:100%;display:flex;justify-content:space-between;gap:1cqw;font-family:Iansui,serif;font-size:clamp(11px,.85cqw,15px);color:#9a8aa4;padding:0 .2cqw 1.1cqw}
.vback{position:absolute;inset:0;transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;padding:3cqw}
.vback p{font-family:"LXGW WenKai TC",Iansui,serif;font-size:clamp(15px,1.4cqw,24px);line-height:2;color:#4a3a55;white-space:pre-wrap;text-align:center}
.vpins{position:absolute;left:0;right:0;top:-1.1cqw;display:flex;justify-content:center;gap:2.6cqw;z-index:2}
.vpins .pin{width:1.1cqw;height:2.5cqw}
.vtag{position:absolute;left:50%;top:-4.6cqh;translate:-50% 0;font-family:Iansui,serif;font-size:clamp(12px,.95cqw,16px);letter-spacing:.12em;color:#f3d28e;white-space:nowrap}
.vbtn{position:absolute;top:50%;translate:0 -50%;width:3.2cqw;height:3.2cqw;border-radius:50%;border:1px solid #c9b6c9;background:#f7efdf;color:#4a3a55;font-size:clamp(14px,1.3cqw,22px);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:.5px 1px 2px rgba(26,20,48,.35)}
.vbtn[disabled]{opacity:.3;cursor:default}
#vPrev{left:18%}
#vNext{right:18%}
.vflip{position:absolute;right:1cqw;bottom:-4.4cqh;font-family:Iansui,serif;font-size:clamp(12px,.9cqw,15px);color:#f3d28e;background:none;border:0;cursor:pointer;letter-spacing:.08em}


#flash{position:absolute;inset:0;z-index:7;background:#fffaf0;opacity:0;pointer-events:none}

#cg{position:absolute;inset:0;z-index:7;display:none;background:#4d3d60}
#cgFall{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
#cgFall>div,#cgShine>div{position:absolute}
#cgShine{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0}
#cg.show{display:block;animation:cgIn .7s ease}
@keyframes cgIn{from{opacity:0}to{opacity:1}}
#cg svg{position:absolute;inset:0;width:100%;height:100%}
#cg image{pointer-events:none}
#cg .hit{cursor:pointer}
#cgLabel{position:absolute;left:50%;top:11%;translate:-50% 0;z-index:2;font-family:Iansui,serif;font-size:clamp(14px,1.2cqw,20px);letter-spacing:.14em;color:#4a3a55;background:#f7efdf;border:1px solid #b48aa8;border-radius:4px;padding:.5cqh 1.2cqw;box-shadow:.5px 1.5px 2px rgba(26,20,48,.35);opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}
#cgLabel.show{opacity:1}

#dark{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .9s ease}
#dark .tint{position:absolute;inset:0;background:#d9473d;mix-blend-mode:multiply;opacity:.62}
#dark .vig{position:absolute;inset:0;background:radial-gradient(ellipse 55% 60% at 81% 52%,rgba(255,110,80,.22),rgba(40,0,6,.6) 85%)}
#dark svg{position:absolute;inset:0;width:100%;height:100%}
#dark .bulbRed{animation:hum 3.2s ease-in-out infinite alternate}
@keyframes hum{from{opacity:.82}to{opacity:1}}
body.darkroom #dark{opacity:1}
body.darkroom #scene #bulbs{opacity:0!important}

body.darkroom #scene #sun,body.darkroom #scene #moonCap,body.darkroom #scene #moonGlow{opacity:0!important}
.eject{position:absolute;left:0;top:0;width:10cqw;z-index:5;transform-origin:50% 0;pointer-events:none}
.eject .paper{background:#fbf6ec;padding:.6cqw .6cqw 2cqw;border-radius:2px;box-shadow:0 1cqw 1.4cqw -.8cqw rgba(10,8,25,.6)}
.eject .win{aspect-ratio:1;background:#2b2433;overflow:hidden;position:relative}
.eject img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;filter:sepia(.6) brightness(1.4)}


.curtain{position:absolute;top:0;bottom:0;width:51%;z-index:8;transition:transform .75s cubic-bezier(.65,0,.35,1);
  background:repeating-linear-gradient(90deg,#6e4a6c 0 2.2cqw,#845d81 2.2cqw 3.4cqw,#6e4a6c 3.4cqw 4.4cqw);box-shadow:inset 0 -1.4cqh 0 #c9a24e}
.curtain::after{content:'';position:absolute;inset:0;background:url(art/paper-qq.webp) center/700px auto;mix-blend-mode:multiply;opacity:.18}
.curtain.l{left:0;transform:translateX(-100%)}
.curtain.r{right:0;transform:translateX(100%)}
.stage.closed .curtain{transform:none}


#frameStars{position:absolute;inset:0;width:100%;height:100%;z-index:10;pointer-events:none}
#frameStars .hot{pointer-events:auto;cursor:pointer}
#frameStars .tag{opacity:0;transition:opacity .2s}
#frameStars .on .tag{opacity:1}
.bulb{animation:twk 2.6s ease-in-out infinite alternate}


.pol .tear{position:absolute;right:-.6cqw;top:.5cqw;width:1.7cqw;height:1.7cqw;border-radius:50%;border:1px solid #9a7f99;background:#f7efdf;color:#8a4f78;font-size:clamp(11px,.95cqw,16px);line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:3;box-shadow:.5px 1px 1.5px rgba(26,20,48,.35)}
body.darkroom .pol .tear{display:flex}
.pol.add .win{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;background:#2b2433;color:#f3d28e;font-family:Iansui,serif}
.pol.add .win b{font-size:clamp(20px,2.4cqw,40px);font-weight:400;line-height:1}
.pol.add .win span{font-size:clamp(11px,.9cqw,15px);letter-spacing:.12em}
.pol.fresh img{animation:develop 2.8s ease-in forwards}
@keyframes develop{from{opacity:0;filter:sepia(.7) brightness(1.5)}50%{opacity:.5}to{opacity:1;filter:none}}

.vform{width:min(36cqw,560px);background:#fbf6ec;color:#3b2f45;border-radius:3px;padding:1.6cqw 1.8cqw 1.2cqw;box-shadow:0 2cqh 4cqh -1.5cqh rgba(10,8,25,.7);max-height:82cqh;overflow:auto}
.vform h2{font-family:Iansui,serif;font-weight:400;font-size:clamp(17px,1.45cqw,25px);letter-spacing:.1em}
.vform .sub{font-family:Iansui,serif;font-size:clamp(11px,.8cqw,14px);color:#9a8aa4;margin:.2cqh 0 .6cqh}
.vform label{display:block;font-family:Iansui,serif;font-size:clamp(11px,.8cqw,14px);color:#9a7f99;letter-spacing:.08em;margin:1.2cqh 0 .5cqh}
.vform input,.vform textarea,.vform select{width:100%;font-family:"LXGW WenKai TC","Noto Serif TC",serif;font-size:clamp(13px,.98cqw,17px);line-height:1.7;color:#3b2f45;background:#f6efdd;border:1px solid #ddcfa8;border-radius:6px;padding:.7cqh .8cqw;outline:none;resize:vertical}
.vform input:focus,.vform textarea:focus,.vform select:focus{border-color:#b48aa8;background:#fffaf0}
.vform .thumb{display:block;max-width:100%;max-height:24cqh;margin:1cqh auto 0;border-radius:2px;box-shadow:.5px 1.5px 2px rgba(26,20,48,.3)}
.vform .whoRow{display:flex;gap:1cqw}
.vform .whoBtn{display:flex;align-items:center;gap:.5cqw;font-family:Iansui,serif;font-size:clamp(12px,.9cqw,15px);background:#fffaf1;border:1px solid #d8c8d8;border-radius:999px;padding:.4cqh 1cqw;cursor:pointer;color:#4a3a55;opacity:.45}
.vform .whoBtn.on{opacity:1;border-color:#9a7f99}
.vform .whoBtn i{display:inline-block;width:.7cqw;height:1.5cqw;border-radius:2px;background:var(--pc)}
.vform .acts{display:flex;justify-content:flex-end;align-items:center;gap:.6cqw;margin-top:2cqh}
.vform .acts .left{margin-right:auto}
.vform .note{font-family:Iansui,serif;font-size:clamp(11px,.85cqw,14px);color:#a0413a;margin-top:1cqh;min-height:1em}
.fbtn{font-family:Iansui,serif;font-size:clamp(12px,.95cqw,16px);background:#fffaf1;border:1px solid #c9b6c9;border-radius:999px;padding:.4cqh 1.2cqw;cursor:pointer;color:#4a3a55}
.fbtn[disabled]{opacity:.5;cursor:default}
.fbtn.plant{background:#a85a63;border-color:#a85a63;color:#fff}
.fbtn.danger{color:#a0413a;border-color:#d8a8a2}
.fbtn.link{border:0;background:none;padding-left:0;color:#8a4f78}

#toast{position:absolute;left:50%;bottom:9%;translate:-50% 0;z-index:8;font-family:Iansui,serif;font-size:clamp(12px,.95cqw,16px);background:#f7efdf;color:#4a3a55;border:1px solid #9a7f99;border-radius:4px;padding:.6cqh 1.2cqw;box-shadow:.5px 1.5px 2px rgba(26,20,48,.35);opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

#scene .drOnly{display:none}
body.darkroom #scene .drOnly{display:inline}
@keyframes twk{from{opacity:.55}to{opacity:1}}
</style>
</head>
<body>
<div class="stage closed" id="stage">
  <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="paper" x="-3%" y="-3%" width="106%" height="112%">
        <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="7" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0" result="mono"/>
        <feComposite in="mono" in2="SourceGraphic" operator="in" result="t"/>
        <feBlend in="SourceGraphic" in2="t" mode="soft-light" result="tex"/>
        <feComposite in="tex" in2="SourceGraphic" operator="arithmetic" k2="0" k3="1" result="p"/>
        <feDropShadow in="p" dx="0" dy="4" stdDeviation="5" flood-color="#0a0b1c" flood-opacity=".42"/>
      </filter>
      <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="pshadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx=".5" dy="1.2" stdDeviation=".9" flood-color="#1a1430" flood-opacity=".3"/></filter>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="bulbGlow" x="-200%" y="-200%" width="500%" height="500%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="rim" x="-20%" y="-20%" width="140%" height="140%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="1.7" result="d"/>
        <feFlood id="rimFlood" flood-color="#ffd98c" flood-opacity="0"/>
        <feComposite in2="d" operator="in" result="glowShape"/>
        <feGaussianBlur in="glowShape" stdDeviation="2.8" result="g"/>
        <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <radialGradient id="lightGrad" gradientUnits="userSpaceOnUse" cx="1160" cy="580" r="1150">
        <stop offset="0" stop-color="#fff4cf"/><stop offset=".18" stop-color="#f6c477"/>
        <stop offset=".42" stop-color="#c47aa6"/><stop offset=".7" stop-color="#4b3a86"/>
        <stop offset="1" stop-color="#151a44"/>
      </radialGradient>
      <mask id="moonCapMask"><circle r="92" fill="#fff"/><circle cx="36" cy="-22" r="88" fill="#000"/></mask>
    </defs>
  </svg>
  <div id="starfall"></div>
  <div id="line"></div>
  <svg id="fore" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"></svg>
  <div id="paperDay"></div><div id="paperNight"></div>
  <div id="dark"><div class="tint"></div><div class="vig"></div>
    <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
      <defs><filter id="redGlow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="16"/></filter></defs>
      <line x1="1290" y1="0" x2="1290" y2="420" stroke="#3a1414" stroke-width="2"/>
      <circle class="bulbRed" cx="1290" cy="458" r="60" fill="#ff4a36" opacity=".9" filter="url(#redGlow)"/>
      
      <circle class="bulbRed" cx="1290" cy="449" r="13" fill="#ff7a5c"/>
      <path d="M1262,420 H1318 L1336,452 H1244Z" fill="#2a1216"/>
    </svg></div>
  <div id="viewer"><div class="vcard" id="vcard"></div>
    <button class="vbtn" id="vPrev" type="button" aria-label="上一張">‹</button><button class="vbtn" id="vNext" type="button" aria-label="下一張">›</button></div>
  <div id="cg"><svg id="cgBack" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"></svg><div id="cgFall"></div><div id="cgShine"></div>
    <svg id="cgSvg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"></svg>
    <svg id="cgTop" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" style="pointer-events:none"></svg>
    <div id="cgLabel"></div></div>
  <div id="flash"></div>
  <div id="toast"></div>
  <input type="file" id="pick" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
  <div class="curtain l"></div><div class="curtain r"></div>
  <img class="frame" src="art/stage/frame-v2.webp" alt="">
  <svg id="frameStars" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="starLine" x="-40%" y="-40%" width="180%" height="180%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="2.2" result="d"/>
        <feComposite in="d" in2="SourceAlpha" operator="out" result="ring"/>
        <feFlood flood-color="#ffe6a6" flood-opacity=".95"/>
        <feComposite in2="ring" operator="in" result="line"/>
        <feGaussianBlur in="line" stdDeviation="1.2" result="gl"/>
        <feMerge><feMergeNode in="gl"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>
