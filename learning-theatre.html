<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="guest.css">
<script src="guest.js"></script>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學習室 · 紙劇場樣本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iansui&family=LXGW+WenKai+TC:wght@400&family=Noto+Serif+TC:wght@400;500&display=swap">
<style>

:root{--paper-day:.05;--paper-night:.08;--paper-size:800px;--n:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#3a2f4f;font-family:"LXGW WenKai TC","Noto Serif TC",serif}
button{font:inherit;color:inherit}
.stage{position:absolute;left:50%;top:50%;width:min(100vw,177.78vh);height:min(56.25vw,100vh);transform:translate(-50%,-50%);container-type:size;overflow:hidden;background:#4d3d60;touch-action:none}
.stage>svg,.stage>.frame{position:absolute;inset:0;width:100%;height:100%;display:block}
.frame{pointer-events:none;z-index:9}
#scene image{pointer-events:none}
#paperDay,#paperNight{position:absolute;inset:0;pointer-events:none;background:url(art/paper-qq.webp) center/var(--paper-size) auto repeat;z-index:4}
#paperDay{mix-blend-mode:multiply;opacity:calc(var(--paper-day) * (1 - var(--n)))}
#paperNight{mix-blend-mode:overlay;opacity:calc(var(--paper-night) * var(--n))}
.plateText{font-family:Iansui,serif}
#starfall{position:absolute;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;opacity:0}
#starfall>div{position:absolute}
#fore{z-index:4;pointer-events:none}


#shelf{position:absolute;inset:0;z-index:2;pointer-events:none;filter:brightness(calc(1 - .28 * var(--n))) saturate(calc(1 - .15 * var(--n)));transition:opacity .4s}
body.open #shelf{opacity:.35}
.spine{position:absolute;pointer-events:auto;cursor:pointer;transform-origin:50% 100%;border-radius:3px 3px 1px 1px;background:var(--bc);
  box-shadow:inset -.25cqw 0 0 rgba(0,0,0,.14),inset .15cqw 0 0 rgba(255,255,255,.18),.5px 1.5px 2px rgba(26,20,48,.4),0 .6cqw .9cqw -.5cqw rgba(10,8,25,.5);
  display:flex;flex-direction:column;align-items:center;padding:1cqw 0 .9cqw;will-change:transform}
.spine::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:url(art/paper-qq.webp) center/420px auto;mix-blend-mode:multiply;opacity:.22}
.spine .band{width:78%;height:.32cqw;border-top:1px solid rgba(255,241,200,.7);border-bottom:1px solid rgba(255,241,200,.7);flex:none}
.spine .band.b2{margin-top:auto}
.spine .lbl{flex:1;margin:.7cqw 0;writing-mode:vertical-rl;text-orientation:mixed;font-family:Iansui,serif;font-size:clamp(10px,.92cqw,16px);letter-spacing:.08em;
  color:#fffaf0;text-shadow:0 1px 1px rgba(40,25,50,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%}
.spine.gone{visibility:hidden}

.spine.flat{padding:0 .8cqw;flex-direction:row;border-radius:2px}
.spine.flat .lbl{writing-mode:horizontal-tb;margin:0;font-size:clamp(9px,.72cqw,13px);opacity:.92}
.spine.flat .band{display:none}


#book{position:absolute;left:13.75cqw;top:7.4cqw;width:72.5cqw;height:42.6cqw;z-index:6;display:none;perspective:220cqw}
body.open #book{display:block}
#book .board{position:absolute;inset:-.7cqw -.8cqw;border-radius:.6cqw;background:var(--bc);box-shadow:0 1.6cqw 2.6cqw -1cqw rgba(10,8,25,.65),inset 0 0 0 .18cqw rgba(255,255,255,.12)}
#book .board::after{content:'';position:absolute;inset:0;border-radius:inherit;background:url(art/paper-qq.webp) center/600px auto;mix-blend-mode:multiply;opacity:.25}
.page{position:absolute;top:0;bottom:0;width:50%;background:#fbf6ec;overflow:hidden}
.page::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 2.35cqw,rgba(140,160,200,.22) 2.35cqw calc(2.35cqw + 1px));background-position:0 5.6cqw}
.page::after{content:'';position:absolute;inset:0;pointer-events:none;background:url(art/paper-qq.webp) center/700px auto;mix-blend-mode:multiply;opacity:.13}
.page.l{left:0;border-radius:.4cqw 0 0 .4cqw;box-shadow:inset -2.2cqw 0 2cqw -1.6cqw rgba(70,50,60,.28)}
.page.r{right:0;border-radius:0 .4cqw .4cqw 0;box-shadow:inset 2.2cqw 0 2cqw -1.6cqw rgba(70,50,60,.28)}

#book .stitch{position:absolute;left:50%;top:1.2cqw;bottom:1.2cqw;width:0;border-left:2px dashed rgba(170,130,150,.55);translate:-1px 0;z-index:2;pointer-events:none}
.inner{position:absolute;inset:2.4cqw 2.6cqw 3.2cqw 3cqw;display:flex;flex-direction:column;z-index:1}
.page.r .inner{inset:2.4cqw 3cqw 3.2cqw 2.8cqw}
.bk-type{font-family:Iansui,serif;font-size:clamp(10px,.78cqw,14px);letter-spacing:.14em;color:var(--bc)}
.bk-name{font-family:Iansui,serif;font-size:clamp(17px,1.65cqw,29px);color:#3b2f45;line-height:1.3;margin-top:.2cqw}
.bk-blurb{font-size:clamp(11px,.86cqw,15px);color:#8a7a92;line-height:1.6;margin-top:.5cqw;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.toc-h{font-family:Iansui,serif;font-size:clamp(11px,.8cqw,14px);letter-spacing:.2em;color:#b49a7a;margin:1.2cqw 0 .3cqw}
.toc{flex:1;overflow:auto;scrollbar-width:thin;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 .8cqw,#000 calc(100% - 1.6cqw),transparent);mask-image:linear-gradient(180deg,transparent 0,#000 .8cqw,#000 calc(100% - 1.6cqw),transparent);padding:.4cqw 0 1.2cqw}
.toc-i{display:flex;align-items:baseline;gap:.6cqw;padding:.32cqw .5cqw;border-radius:.3cqw;cursor:pointer;font-size:clamp(12px,.92cqw,16px);color:#4a3a55;line-height:1.5}
.toc-i:hover{background:rgba(180,138,168,.12)}
.toc-i.on{background:rgba(180,138,168,.22);color:#2f2438}
.toc-i .no{font-family:Iansui,serif;font-size:.78em;color:#b49a7a;min-width:1.6em;text-align:right;flex:none}
.toc-i .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-i .d{font-family:Iansui,serif;font-size:.72em;color:#a898ae;flex:none}
.toc-i .pin{color:#c9a24e;flex:none}
.toc-i .rv{width:.45cqw;height:.45cqw;border-radius:50%;background:#d9925a;flex:none;align-self:center}
.pg-title{font-family:Iansui,serif;font-size:clamp(16px,1.42cqw,25px);color:#3b2f45;line-height:1.35}
.pg-meta{display:flex;flex-wrap:wrap;align-items:center;gap:.6cqw;margin:.45cqw 0 .6cqw;font-family:Iansui,serif;font-size:clamp(10px,.78cqw,14px);color:#a898ae}
.tag{border:1px solid currentColor;border-radius:999px;padding:0 .55cqw;line-height:1.6}
.tag.class{color:#8a6fa8}.tag.homework{color:#b07a52}.tag.self{color:#6f8f6a}.tag.rv{color:#d9925a}.tag.pin{color:#c9a24e}
.pg-body{flex:1;overflow:auto;scrollbar-width:thin;font-size:clamp(13px,1.02cqw,18px);line-height:2.3cqw;color:#3b2f45;padding-right:.4cqw;
  -webkit-mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 2cqw),transparent);mask-image:linear-gradient(180deg,#000 0,#000 calc(100% - 2cqw),transparent);padding-bottom:2cqw}
.pg-body p,.pg-body .li{min-height:2.35cqw;overflow-wrap:anywhere}
.pg-body .li{padding-left:1.3cqw;position:relative}
.pg-body .li::before{content:'';position:absolute;left:.35cqw;top:1cqw;width:.42cqw;height:.42cqw;border-radius:50%;background:#b48aa8}
.pg-body .gap{height:1.1cqw}
.pg-body h4{font-family:Iansui,serif;font-weight:400;font-size:1.08em;color:#8a4f78;min-height:2.35cqw}
.pg-body b{color:#6a3d5e;font-weight:600}
.pg-body code{font-family:"Cascadia Mono",Consolas,monospace;font-size:.86em;background:rgba(170,190,220,.22);border-radius:.25cqw;padding:0 .3cqw}

.pg-body pre{font-family:"Cascadia Mono",Consolas,monospace;font-size:clamp(11px,.86cqw,15px);line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;color:#2f3a4a;
  background:#f6f3e8 repeating-linear-gradient(0deg,transparent 0 1.2cqw,rgba(120,150,190,.18) 1.2cqw calc(1.2cqw + 1px)),repeating-linear-gradient(90deg,transparent 0 1.2cqw,rgba(120,150,190,.18) 1.2cqw calc(1.2cqw + 1px));
  border:1px solid rgba(150,170,200,.4);border-radius:.3cqw;padding:.8cqw 1cqw}
.pg-foot{position:absolute;left:0;right:0;bottom:1.1cqw;text-align:center;font-family:Iansui,serif;font-size:clamp(10px,.78cqw,14px);color:#b49a7a;z-index:1}
.empty{margin:auto;text-align:center;font-family:Iansui,serif;color:#a898ae;font-size:clamp(13px,1cqw,18px);line-height:2}

.ear{position:absolute;bottom:0;width:3.4cqw;height:3.4cqw;cursor:pointer;z-index:3}
.ear::before{content:'';position:absolute;inset:0;transition:transform .25s}
.ear.next{right:0;background:linear-gradient(315deg,transparent 50%,transparent 50%)}
.ear.next::before{background:linear-gradient(135deg,transparent 49%,#e9dfca 50%,#d9cdb2 100%);clip-path:polygon(100% 0,0 100%,100% 100%);opacity:.0}
.ear.next::after{content:'';position:absolute;right:0;bottom:0;width:2.4cqw;height:2.4cqw;background:linear-gradient(315deg,#ddcfb2 0 50%,transparent 50%);filter:drop-shadow(-1px -1px 1.5px rgba(60,40,60,.3));transition:width .2s,height .2s}
.ear.prev{left:0}
.ear.prev::after{content:'';position:absolute;left:0;bottom:0;width:2.4cqw;height:2.4cqw;background:linear-gradient(45deg,#ddcfb2 0 50%,transparent 50%);filter:drop-shadow(1px -1px 1.5px rgba(60,40,60,.3));transition:width .2s,height .2s}
.ear:hover::after{width:3cqw;height:3cqw}
.ear.off{display:none}

#leaf{position:absolute;top:0;bottom:0;left:50%;width:50%;transform-origin:0 50%;transform-style:preserve-3d;z-index:4;display:none;pointer-events:none}
#leaf .face{position:absolute;inset:0;backface-visibility:hidden;background:#fbf6ec;overflow:hidden;border-radius:0 .4cqw .4cqw 0}
#leaf .face::before{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,transparent 0 2.35cqw,rgba(140,160,200,.22) 2.35cqw calc(2.35cqw + 1px));background-position:0 5.6cqw}
#leaf .back{transform:rotateY(180deg);border-radius:.4cqw 0 0 .4cqw;background:#f7f0e2}
#leaf .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(60,40,60,.22),transparent 40%);opacity:0}

#tabs{position:absolute;left:52%;right:3%;top:-2.5cqw;height:2.8cqw;display:flex;gap:.5cqw;z-index:0}
.rtab{position:relative;max-width:11cqw;height:100%;padding:.25cqw .8cqw 0;border-radius:.4cqw .4cqw 0 0;background:var(--tc);color:#fffaf0;font-family:Iansui,serif;
  font-size:clamp(10px,.78cqw,14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-decoration:none;box-shadow:inset 0 -.5cqw .6cqw -.4cqw rgba(0,0,0,.2);transition:translate .2s}
.rtab:hover{translate:0 -.35cqw}

#stack{position:absolute;left:87.2cqw;top:38cqw;width:8.2cqw;height:5.4cqw;z-index:6;display:none;cursor:pointer}
body.open #stack.has{display:block}
#stack .c{position:absolute;inset:0;background:#fffaf1;border:1px solid #e3d6bd;border-radius:.3cqw;box-shadow:.5px 1.5px 2px rgba(26,20,48,.35)}
#stack .c:nth-child(1){rotate:-7deg;translate:-.4cqw .5cqw}
#stack .c:nth-child(2){rotate:4deg;translate:.3cqw .2cqw}
#stack .c:nth-child(3){rotate:-1deg;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#fffaf1 repeating-linear-gradient(180deg,transparent 0 1cqw,rgba(214,120,120,.22) 1cqw calc(1cqw + 1px));background-position:0 1.6cqw}
#stack .c b{font-family:Iansui,serif;font-weight:400;font-size:clamp(12px,1cqw,17px);color:#4a3a55;letter-spacing:.1em}
#stack .c span{font-family:Iansui,serif;font-size:clamp(9px,.7cqw,12px);color:#9a8aa4;margin-top:.2cqw}
#stack:hover .c:nth-child(3){translate:0 -.4cqw}


#practice{position:absolute;inset:0;z-index:7;display:none;perspective:160cqw}

#practice::before{content:'';position:absolute;inset:0;background:rgba(30,24,50,.4);animation:pfade .3s ease}
@keyframes pfade{from{opacity:0}to{opacity:1}}
body.practicing #practice{display:block}
body.practicing #book,body.practicing #stack{opacity:0;pointer-events:none}
#pTop{position:absolute;left:0;right:0;top:9.5cqw;text-align:center;font-family:Iansui,serif;font-size:clamp(12px,1cqw,17px);letter-spacing:.14em;color:#fbf3e2;text-shadow:0 1px 2px rgba(20,14,35,.6)}
#pcard{position:absolute;left:31.25cqw;top:12.5cqw;width:37.5cqw;height:22.5cqw;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.3,1);cursor:pointer}
#pcard.flipped{transform:rotateY(180deg)}
#pcard .f{position:absolute;inset:0;backface-visibility:hidden;border-radius:.5cqw;background:#fffaf1;box-shadow:0 1.4cqw 2.2cqw -1cqw rgba(10,8,25,.65);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2cqw 3cqw;text-align:center;overflow:hidden}
#pcard .f::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:url(art/paper-qq.webp) center/600px auto;mix-blend-mode:multiply;opacity:.12}
#pcard .front{background:#fffaf1 repeating-linear-gradient(180deg,transparent 0 2.2cqw,rgba(140,160,200,.2) 2.2cqw calc(2.2cqw + 1px));background-position:0 3.6cqw;border-top:.5cqw solid #d98e8e}
#pcard .back{transform:rotateY(180deg);background:#fbf3e2;border-top:.5cqw solid var(--bc)}
#pcard .q{font-family:Iansui,serif;font-size:clamp(17px,1.7cqw,30px);color:#3b2f45;line-height:1.55;overflow-wrap:anywhere}
#pcard .a{font-size:clamp(14px,1.18cqw,21px);color:#3b2f45;line-height:1.85;overflow:auto;max-height:100%;overflow-wrap:anywhere;white-space:pre-wrap;text-align:left}
#pcard .hint{position:absolute;bottom:1cqw;left:0;right:0;font-family:Iansui,serif;font-size:clamp(10px,.75cqw,13px);color:#b49a7a;letter-spacing:.12em}
#pcard.done{cursor:default}
#pcard .sum{font-family:Iansui,serif;font-size:clamp(18px,1.7cqw,30px);color:#3b2f45;letter-spacing:.08em}
#pcard .sumSub{font-size:clamp(12px,.95cqw,17px);color:#8a7a92;margin-top:.8cqw}
#pcard .acts{display:flex;gap:.8cqw;margin-top:1.8cqw;flex-wrap:wrap;justify-content:center}
.pbtn{font-family:Iansui,serif;font-size:clamp(12px,.95cqw,16px);background:#fffaf1;border:1px solid #c9b6c9;border-radius:999px;padding:.4cqh 1.3cqw;cursor:pointer;color:#4a3a55}
.pbtn:hover{border-color:#8a4f78;color:#8a4f78}
.pbox{position:absolute;top:38.5cqw;width:15cqw;height:9.5cqw;cursor:pointer}
.pbox.again{left:18.5cqw}
.pbox.known{left:66.5cqw}
.pbox .bk{position:absolute;left:4%;right:4%;top:0;height:30%;background:var(--bxD);border-radius:.4cqw .4cqw 0 0}
.pbox .fr{position:absolute;left:0;right:0;top:22%;bottom:0;background:var(--bx);border-radius:.2cqw .2cqw .6cqw .6cqw;box-shadow:0 1cqw 1.4cqw -.8cqw rgba(10,8,25,.6),inset 0 .35cqw 0 rgba(255,255,255,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.pbox .fr::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:url(art/paper-qq.webp) center/400px auto;mix-blend-mode:multiply;opacity:.2}
.pbox b{font-family:Iansui,serif;font-weight:400;font-size:clamp(14px,1.25cqw,22px);color:#fffaf0;letter-spacing:.2em;text-shadow:0 1px 1px rgba(40,25,50,.3)}
.pbox span{font-family:Iansui,serif;font-size:clamp(10px,.8cqw,14px);color:rgba(255,250,240,.85);margin-top:.2cqw}
.pbox.again{--bx:#c98a7e;--bxD:#a86d63}
.pbox.known{--bx:#8fae8a;--bxD:#6f8f6a}
.pbox:hover .fr{translate:0 -.25cqw}
.flyc{position:absolute;z-index:8;border-radius:.4cqw;background:#fffaf1;box-shadow:0 .8cqw 1.4cqw -.8cqw rgba(10,8,25,.6);pointer-events:none;display:flex;align-items:center;justify-content:center;padding:2cqw 3cqw;overflow:hidden}
.flyc .fq{font-family:Iansui,serif;font-size:clamp(14px,1.3cqw,24px);color:#3b2f45;text-align:center;line-height:1.5;overflow:hidden;max-height:100%}
.spark{position:absolute;z-index:9;pointer-events:none;color:#ffe9a8;font-size:clamp(10px,1cqw,18px);text-shadow:0 0 .6cqw rgba(255,226,150,.9)}


#drawer{position:absolute;left:2.4cqw;top:46.4cqw;width:18.5cqw;height:5.4cqw;z-index:5;transform:translateX(-120%);transition:transform .6s cubic-bezier(.3,.7,.3,1);pointer-events:none;
  filter:brightness(calc(1 - .25 * var(--n)))}
body.drawer #drawer{transform:none}
#drawer .box{position:absolute;inset:0;background:#b48f6c;border-radius:.35cqw;box-shadow:0 .8cqw 1.2cqw -.6cqw rgba(10,8,25,.6),inset 0 .3cqw 0 rgba(255,255,255,.18),inset 0 -.35cqw 0 rgba(0,0,0,.12)}
#drawer .box::after{content:'';position:absolute;inset:0;border-radius:inherit;background:url(art/paper-qq.webp) center/400px auto;mix-blend-mode:multiply;opacity:.25}
#drawer .knob{position:absolute;left:50%;top:50%;width:1.5cqw;height:1.5cqw;margin:-.75cqw;border-radius:50%;background:#cfa64e;box-shadow:inset -1px -1px 0 #7d5f24,.5px 1px 1.5px rgba(26,20,48,.4);z-index:1}
#drawer .lbl{position:absolute;left:0;right:0;bottom:.35cqw;text-align:center;font-family:Iansui,serif;font-size:clamp(9px,.7cqw,12px);letter-spacing:.3em;color:#f7ead2;z-index:1}
#drawer .pencil{position:absolute;left:1.6cqw;top:-1.1cqw;width:8.6cqw;height:.95cqw;background:linear-gradient(180deg,#f0cf6a 0 50%,#e0b84e 50%);border-radius:.15cqw;rotate:-5deg;box-shadow:.5px 1px 1px rgba(26,20,48,.35)}
#drawer .pencil::before{content:'';position:absolute;right:-1.1cqw;top:0;border-left:1.1cqw solid #f1d9b0;border-top:.475cqw solid transparent;border-bottom:.475cqw solid transparent}
#drawer .pencil::after{content:'';position:absolute;left:-.9cqw;top:0;width:.9cqw;height:100%;background:#e9a4a8;border-radius:.15cqw 0 0 .15cqw}
#drawer .eraser{position:absolute;right:2.2cqw;top:-1cqw;width:2.8cqw;height:1.4cqw;background:linear-gradient(90deg,#f2f0ea 0 38%,#8fa2c4 38%);border-radius:.25cqw;rotate:9deg;box-shadow:.5px 1px 1px rgba(26,20,48,.35)}
#drawer .sticky{position:absolute;left:11.4cqw;top:-1.7cqw;width:2.6cqw;height:2.6cqw;background:#f6e7a2;rotate:-11deg;box-shadow:.5px 1px 1px rgba(26,20,48,.3)}

.dwrow{display:none;gap:.45cqw;flex-wrap:wrap;margin:.45cqw 0 .1cqw}
body.drawer .dwrow{display:flex}
.chip{font-family:Iansui,serif;font-size:clamp(10px,.78cqw,14px);line-height:1.6;background:#fffaf1;border:1px solid #c9b6c9;border-radius:999px;padding:0 .75cqw;cursor:pointer;color:#6a5470;white-space:nowrap;user-select:none}
.chip:hover{border-color:#8a4f78;color:#8a4f78}
.chip.on{background:#b48aa8;border-color:#b48aa8;color:#fff}
.chip.danger{color:#a0413a;border-color:#d8a8a2}
.toc-add{display:none;align-items:center;gap:.5cqw;padding:.32cqw .5cqw;margin-bottom:.2cqw;border:1px dashed #c9b6c9;border-radius:.3cqw;cursor:pointer;font-family:Iansui,serif;font-size:clamp(12px,.9cqw,16px);color:#8a4f78}
.toc-add:hover{background:rgba(180,138,168,.12)}
body.drawer .toc-add{display:flex}
.spine.add{display:none;background:rgba(255,250,240,.12);border:2px dashed rgba(255,250,240,.8);box-shadow:none;align-items:center;justify-content:center}
.spine.add::after{display:none}
.spine.add .lbl{color:#fffaf0;text-shadow:0 1px 2px rgba(40,25,50,.5)}
body.drawer .spine.add{display:flex}
.rtab .x{display:none;margin-left:.4cqw;padding:0 .2cqw;border-radius:50%;background:rgba(255,255,255,.3)}
body.drawer .rtab .x{display:inline}
.rtab.add{display:none;--tc:#a898ae;border:1px dashed rgba(255,250,240,.8)}
body.drawer .rtab.add{display:block}
body.drawer.open #stack{display:block}
#stack .c b small{font-size:.8em}

#form{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(20,16,35,.38)}
#form.show{display:flex;animation:ffade .25s ease}
@keyframes ffade{from{background:rgba(20,16,35,0)}to{background:rgba(20,16,35,.38)}}
.vform{position:relative;width:min(38cqw,600px);background:#fbf6ec;color:#3b2f45;border-radius:3px;padding:1.6cqw 1.9cqw 1.3cqw;box-shadow:0 2cqh 4cqh -1.5cqh rgba(10,8,25,.7);max-height:84cqh;overflow:auto;animation:vdrop .4s cubic-bezier(.22,1,.36,1)}
.vform.wide{width:min(56cqw,880px)}
@keyframes vdrop{from{opacity:0;translate:0 -3cqh;scale:.95}to{opacity:1;translate:0 0;scale:1}}
.vform::after{content:'';position:absolute;inset:0;border-radius:3px;pointer-events:none;background:url(art/paper-qq.webp) center/600px auto;mix-blend-mode:multiply;opacity:.1}
.vform h2{font-family:Iansui,serif;font-weight:400;font-size:clamp(17px,1.45cqw,25px);letter-spacing:.1em}
.vform .sub{font-family:Iansui,serif;font-size:clamp(11px,.8cqw,14px);color:#9a8aa4;margin:.2cqh 0 .6cqh}
.vform .sub2{font-size:clamp(13px,.95cqw,16px);color:#6a5a72;line-height:1.8;margin:1.2cqh 0 .4cqh}
.vform label{display:block;font-family:Iansui,serif;font-size:clamp(11px,.8cqw,14px);color:#9a7f99;letter-spacing:.08em;margin:1.3cqh 0 .5cqh}
.vform input,.vform textarea{width:100%;font-family:"LXGW WenKai TC","Noto Serif TC",serif;font-size:clamp(13px,.98cqw,17px);line-height:1.7;color:#3b2f45;background:#f6efdd;border:1px solid #ddcfa8;border-radius:6px;padding:.7cqh .8cqw;outline:none;resize:vertical}
.vform textarea.code{font-family:"Cascadia Mono",Consolas,monospace;font-size:clamp(12px,.88cqw,15px)}
.vform input:focus,.vform textarea:focus{border-color:#b48aa8;background:#fffaf0}
.vform .chips{display:flex;flex-wrap:wrap;gap:.45cqw}
.vform .row2{display:flex;gap:2cqw;flex-wrap:wrap}
.vform .acts{display:flex;justify-content:flex-end;align-items:center;gap:.6cqw;margin-top:2cqh}
.vform .acts .left{margin-right:auto}
.vform .note{font-family:Iansui,serif;font-size:clamp(11px,.85cqw,14px);color:#a0413a;margin-top:1cqh;min-height:1em}
.fbtn{font-family:Iansui,serif;font-size:clamp(12px,.95cqw,16px);background:#fffaf1;border:1px solid #c9b6c9;border-radius:999px;padding:.4cqh 1.2cqw;cursor:pointer;color:#4a3a55}
.fbtn.plant{background:#a85a63;border-color:#a85a63;color:#fff}
.fbtn.danger{color:#a0413a;border-color:#d8a8a2}

.cnew{display:grid;grid-template-columns:1fr 1fr auto;gap:.6cqw;margin-top:1.2cqh}
.clist{margin-top:1.4cqh;display:flex;flex-direction:column;gap:.6cqh;max-height:46cqh;overflow:auto;padding-right:.3cqw}
.crow{display:grid;grid-template-columns:1fr 1fr auto auto;gap:.6cqw;align-items:center}
.crow input{padding:.45cqh .7cqw}
.cempty{font-family:Iansui,serif;color:#a898ae;text-align:center;padding:2cqh 0}


.curtain{position:absolute;top:0;bottom:0;width:51%;z-index:8;transition:transform .75s cubic-bezier(.65,0,.35,1);
  background:repeating-linear-gradient(90deg,#6e4a6c 0 2.2cqw,#845d81 2.2cqw 3.4cqw,#6e4a6c 3.4cqw 4.4cqw);box-shadow:inset 0 -1.4cqh 0 #c9a24e}
.curtain::after{content:'';position:absolute;inset:0;background:url(art/paper-qq.webp) center/700px auto;mix-blend-mode:multiply;opacity:.18}
.curtain.l{left:0;transform:translateX(-100%)}
.curtain.r{right:0;transform:translateX(100%)}
.stage.closed .curtain{transform:none}


#frameStars{position:absolute;inset:0;width:100%;height:100%;z-index:10;pointer-events:none}
#frameStars .hot{pointer-events:auto;cursor:pointer}
#frameStars .tag{opacity:0;transition:opacity .2s}
#frameStars .on .tag{opacity:1}

#toast{position:absolute;left:50%;bottom:9%;translate:-50% 0;z-index:8;font-family:Iansui,serif;font-size:clamp(12px,.95cqw,16px);background:#f7efdf;color:#4a3a55;border:1px solid #9a7f99;border-radius:4px;padding:.6cqh 1.2cqw;box-shadow:.5px 1.5px 2px rgba(26,20,48,.35);opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}

    <div id="pcard"></div>

    <div class="pbox known" id="boxKnown"><div class="bk"></div><div class="fr"><b>會了</b><span id="nKnown">0</span></div></div>
  </div>
  <div id="drawer"><div class="pencil"></div><div class="sticky"></div><div class="eraser"></div><div class="box"></div><div class="knob"></div><div class="lbl">抽　屜</div></div>

    <defs>
      <filter id="starLine" x="-40%" y="-40%" width="180%" height="180%">

      </filter>

  </svg>
</div>
